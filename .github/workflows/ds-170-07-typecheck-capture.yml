name: DS-170-07 typecheck capture

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'record current typecheck output') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Capture output
        run: |
          mkdir -p docs/qa
          set +e
          npm run typecheck > docs/qa/ds-170-07-typecheck-output.txt 2>&1
          status=$?
          printf '\nExit status: %s\n' "$status" >> docs/qa/ds-170-07-typecheck-output.txt
          exit 0
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/ds-170-07-typecheck-output.txt
          git commit -m "chore(ds-170-07): record current typecheck output"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
