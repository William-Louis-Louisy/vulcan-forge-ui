name: DS-181R Format

on:
  push:
    branches:
      - agent/ds-181r-01-component-domain-v2
  workflow_dispatch:

jobs:
  format:
    name: Generate formatted DS-181R files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-01-component-domain-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format DS-181R files
        run: >-
          npx prettier
          src/domain/design-system/component-contract-v2.schema.ts
          src/domain/design-system/component-contract-v2.schema.test.ts
          src/features/tokens/delete-token.utils.ts
          --write

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/design-system/component-contract-v2.schema.ts \
            src/domain/design-system/component-contract-v2.schema.test.ts \
            src/features/tokens/delete-token.utils.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format DS-181R-01 files"
          git push origin HEAD:agent/ds-181r-01-component-domain-v2
