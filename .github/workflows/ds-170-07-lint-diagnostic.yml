name: DS-170-07 lint diagnostic

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'capture lint diagnostic') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture lint output
        run: |
          mkdir -p docs/qa
          set +e
          npm run lint > docs/qa/ds-170-07-lint-diagnostic.txt 2>&1
          status=$?
          printf '\nExit status: %s\n' "$status" >> docs/qa/ds-170-07-lint-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/ds-170-07-lint-diagnostic.txt
          git commit -m "chore(ds-170-07): capture lint diagnostic"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
