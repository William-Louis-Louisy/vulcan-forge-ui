name: DS-170-07C Pre-QA Follow-up

on:
  push:
    branches:
      - feature/ds-170-07c-project-deletion

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07c-project-deletion
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply requested pre-QA corrections
        run: node scripts/ds-170-07c-pre-qa-followup.mjs
      - name: Format touched files
        run: >-
          npx prettier
          "src/app/[locale]/app/projects/[projectSlug]/page.tsx"
          src/messages/project-overview-messages.ts
          src/app/globals.css
          scripts/audit-ui.ts
          docs/product/ds-170-07c-project-deletion.md
          --write
      - name: Remove temporary files
        run: |
          rm .github/workflows/ds-170-07c-pre-qa-followup.yml
          rm scripts/ds-170-07c-pre-qa-followup.mjs
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ds-170-07c): apply pre-QA overview and quality corrections"
          git push origin HEAD:feature/ds-170-07c-project-deletion
