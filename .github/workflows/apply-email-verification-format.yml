name: Apply email verification formatting

on:
  push:
    branches:
      - feature/ds-170-auth-03-email-verification

permissions:
  contents: write

concurrency:
  group: apply-email-verification-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-03-email-verification

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format verification route coverage
        run: npx prettier src/app/api/auth/verify-email/route.test.ts --write

      - name: Commit formatted source
        run: |
          git rm .github/workflows/apply-email-verification-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/auth/verify-email/route.test.ts
          git commit -m "style(auth): format verification route coverage"
          git push origin HEAD:feature/ds-170-auth-03-email-verification
