name: DS-181R-03B Runtime Repro

on:
  push:
    branches:
      - agent/ds-181r-03b-border-radius-correctness

jobs:
  repro:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Create real provider + Button preview reproduction
        run: |
          cat > src/features/components/ds-181r-03b-runtime-repro.test.tsx <<'EOF'
          import { render, screen } from '@testing-library/react';
          import userEvent from '@testing-library/user-event';
          import { describe, expect, it, vi } from 'vitest';
          import {
            migrateLegacyComponentContract,
            type ComponentContract,
          } from '@/domain/design-system';
          import {
            ComponentContractPreviewProvider,
            useComponentContractPreview,
          } from './ComponentContractPreviewContext';
          import { ComponentFoundationsPreviewClient } from './ComponentFoundationsPreviewClient';
          import type { ComponentRegistryItem } from './components-registry.utils';
          import { setButtonVisualProperty } from './button-visual-customization.utils';

          vi.mock('next-intl', () => ({
            useTranslations: () => (key: string) => key,
          }));

          const contract: ComponentContract = {
            type: 'button',
            name: 'Button',
            purpose: { en: 'Triggers an action.' },
            status: 'ready',
            anatomy: ['root', 'label'],
            variants: [{ key: 'primary', label: { en: 'Primary' } }],
            sizes: [{ key: 'md', label: { en: 'Medium' } }],
            states: [],
            tokenBindings: [
              {
                key: 'radius',
                tokenType: 'radius',
                tokenPath: 'radius.md',
              },
            ],
            accessibility: [],
            forbiddenPatterns: [],
          };

          const contractV2 = migrateLegacyComponentContract(contract);
          const component: ComponentRegistryItem = {
            id: 'button',
            key: 'button',
            templateKey: 'button',
            type: 'button',
            name: 'Button',
            status: 'ready',
            category: 'action',
            platforms: ['web'],
            contract,
            contractV2,
            isValid: true,
            completeness: {
              score: 100,
              level: 'complete',
              missingFields: [],
              warnings: [],
            },
          };

          const rawTokenSets = [
            {
              type: 'radius',
              name: 'Radius',
              tokens: [
                {
                  path: 'radius.md',
                  type: 'radius',
                  value: '0.5rem',
                  description: { en: 'Medium radius.' },
                  status: 'ready',
                },
              ],
            },
          ];

          function ApplyMixedRadius() {
            const preview = useComponentContractPreview();
            return (
              <button
                type="button"
                onClick={() => {
                  if (!preview) return;
                  let next = setButtonVisualProperty(
                    preview.contractV2,
                    { kind: 'base' },
                    'radius',
                    'radius',
                    { source: 'value', value: '8px' },
                  );
                  next = setButtonVisualProperty(
                    next,
                    { kind: 'base' },
                    'radius',
                    'topLeft',
                    { source: 'value', value: '18px' },
                  );
                  next = setButtonVisualProperty(
                    next,
                    { kind: 'base' },
                    'radius',
                    'bottomRight',
                    { source: 'value', value: '32px' },
                  );
                  preview.setContractV2(next);
                }}
              >
                Apply mixed
              </button>
            );
          }

          function ApplyFourCorners() {
            const preview = useComponentContractPreview();
            return (
              <button
                type="button"
                onClick={() => {
                  if (!preview) return;
                  let next = preview.contractV2;
                  for (const [property, value] of [
                    ['topLeft', '4px'],
                    ['topRight', '8px'],
                    ['bottomRight', '16px'],
                    ['bottomLeft', '32px'],
                  ] as const) {
                    next = setButtonVisualProperty(
                      next,
                      { kind: 'base' },
                      'radius',
                      property,
                      { source: 'value', value },
                    );
                  }
                  preview.setContractV2(next);
                }}
              >
                Apply four
              </button>
            );
          }

          describe('DS-181R-03B runtime reproduction', () => {
            it('renders uniform plus asymmetric corners while the legacy radius visual token exists', async () => {
              const user = userEvent.setup();
              render(
                <ComponentContractPreviewProvider
                  initialContract={contract}
                  initialContractV2={contractV2}
                >
                  <ApplyMixedRadius />
                  <ComponentFoundationsPreviewClient
                    locale="en"
                    component={component}
                    rawTokenSets={rawTokenSets}
                  />
                </ComponentContractPreviewProvider>,
              );

              await user.click(screen.getByRole('button', { name: 'Apply mixed' }));
              const previewButton = screen.getByRole('button', { name: 'Button' });
              expect(previewButton.style.borderRadius).toBe('');
              expect(previewButton.style.borderTopLeftRadius).toBe('18px');
              expect(previewButton.style.borderTopRightRadius).toBe('8px');
              expect(previewButton.style.borderBottomRightRadius).toBe('32px');
              expect(previewButton.style.borderBottomLeftRadius).toBe('8px');
            });

            it('renders four independent corners while the legacy radius visual token exists', async () => {
              const user = userEvent.setup();
              render(
                <ComponentContractPreviewProvider
                  initialContract={contract}
                  initialContractV2={contractV2}
                >
                  <ApplyFourCorners />
                  <ComponentFoundationsPreviewClient
                    locale="en"
                    component={component}
                    rawTokenSets={rawTokenSets}
                  />
                </ComponentContractPreviewProvider>,
              );

              await user.click(screen.getByRole('button', { name: 'Apply four' }));
              const previewButton = screen.getByRole('button', { name: 'Button' });
              expect(previewButton.style.borderRadius).toBe('');
              expect(previewButton.style.borderTopLeftRadius).toBe('4px');
              expect(previewButton.style.borderTopRightRadius).toBe('8px');
              expect(previewButton.style.borderBottomRightRadius).toBe('16px');
              expect(previewButton.style.borderBottomLeftRadius).toBe('32px');
            });
          });
          EOF
      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://vulcan:vulcan@localhost:5432/vulcan?schema=public
      - name: Reproduce mixed radius with legacy token binding
        run: npx vitest run src/features/components/ds-181r-03b-runtime-repro.test.tsx -t "uniform plus asymmetric"
      - name: Reproduce four-corner radius with legacy token binding
        run: npx vitest run src/features/components/ds-181r-03b-runtime-repro.test.tsx -t "four independent corners"
