name: Run DS-160-07-A2b

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feature/ds-160-07a2b-accessibility-score'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Apply implementation patch
        run: python scripts/apply-ds-160-07a2b.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format implementation
        run: npm run format

      - name: Validate implementation
        run: npm run quality

      - name: Commit validated implementation
        shell: bash
        run: |
          rm .github/workflows/apply-ds-160-07a2b.yml
          rm .github/workflows/run-ds-160-07a2b.yml
          rm docs/product/ds-160-07a2b-pr-placeholder.md
          rm scripts/apply-ds-160-07a2b.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: explain accessibility score calculation"
          git push origin HEAD:${{ github.head_ref }}
