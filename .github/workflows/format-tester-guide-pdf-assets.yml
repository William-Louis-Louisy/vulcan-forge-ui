name: Format tester guide PDF assets

on:
  push:
    branches:
      - docs/tester-user-guide
    paths:
      - docs/testing/vulcanforge-ui-guide-pdf.css
      - .github/workflows/format-tester-guide-pdf-assets.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: docs/tester-user-guide

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format PDF assets
        run: npx prettier docs/testing/vulcanforge-ui-guide-pdf.css --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/vulcanforge-ui-guide-pdf.css
          git commit -m "docs: format tester guide PDF stylesheet"
          git push origin HEAD:docs/tester-user-guide
