name: Enrich tester guide field guidance

on:
  push:
    branches:
      - docs/tester-user-guide
    paths:
      - .github/workflows/enrich-tester-guide-fields.yml

permissions:
  contents: write

jobs:
  enrich-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v6
        with:
          ref: docs/tester-user-guide

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add field purpose guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          guide_path = Path('docs/testing/vulcanforge-ui-guide-testeurs.fr.md')
          text = guide_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              occurrences = text.count(old)
              if occurrences != 1:
                  raise RuntimeError(
                      f'Expected one occurrence, found {occurrences}: {old[:80]!r}'
                  )
              text = text.replace(old, new, 1)

          replace_once(
              """**Version du guide :** 1.0  
          **Date :** 31 juillet 2026  
          **Périmètre :** application VulcanForge UI avant le parcours final DS-170-08  
          **Public :** testeurs fonctionnels, testeurs UX, parties prenantes et utilisateurs découvrant les design systems

          > Ce document explique comment prendre en main l’application et utiliser chaque espace fonctionnel. Il ne remplace pas le protocole de recette : les anomalies doivent être consignées séparément avec leurs étapes de reproduction.
""",
              """**Version du guide :** 1.1  
          **Date :** 3 août 2026  
          **Périmètre :** application VulcanForge UI avant le parcours final DS-170-08  
