name: Format auth passwords

on:
  push:
    branches:
      - feature/ds-170-auth-02-passwords

permissions:
  contents: write

concurrency:
  group: format-auth-passwords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-02-passwords

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format password service
        run: >-
          npx prettier
          src/server/auth/password/password-compromise-check.test.ts
          src/server/auth/password/password-hash-format.test.ts
          src/server/auth/password/password-hash-format.ts
          src/server/auth/password/password-normalization.test.ts
          --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/auth/password
          git commit -m "Format password service"
          git push origin HEAD:feature/ds-170-auth-02-passwords
