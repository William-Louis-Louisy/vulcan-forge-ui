name: DS-181R-04 QA fixes v3

on:
  push:
    branches:
      - agent/ds-181r-04-textfield-customization
    paths:
      - .github/workflows/ds-181r-04-qa-fixes-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/vulcan_forge_ui?schema=public
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-04-textfield-customization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply QA fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/ds-181r-04-qa-fixes.yml').read_text()
          marker = "python3 - <<'PY'\n"
          marker_start = workflow.index(marker) + len(marker)
          marker_end = workflow.index('\n          PY\n', marker_start)
          embedded = workflow[marker_start:marker_end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          Path('/tmp/apply-r04-qa-fixes.py').write_text(script + '\n')
          PY
          python3 /tmp/apply-r04-qa-fixes.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/components/ButtonVisualCustomizationEditor.tsx')
          text = path.read_text()
          pattern = re.compile(
              r"\s+onRemove=\{\s*isFocusStateScope\(scope\)\s*\?\s*undefined\s*:\s*\(\)\s*=>\s*removeOptionalGroup\('border'\)\s*\}\s*removeLabel=\{t\('removeProperty'\)\}"
          )
          replacement = """
              {...(isFocusStateScope(scope)
                ? {}
                : { onRemove: () => removeOptionalGroup('border') })}
              removeLabel={t('removeProperty')}"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one focus-state InspectorGroup prop, replaced {count}')
          path.write_text(text)
          PY
      - name: Format changed files
        run: >-
          npx prettier
          src/domain/design-system/mvp-seed-templates.ts
          src/domain/design-system/component-template-registry.ts
          src/domain/design-system/component-template-registry.test.ts
          src/features/components/components-registry.utils.ts
          src/features/components/components-registry.utils.test.ts
          src/features/components/ButtonVisualCustomizationEditor.tsx
          src/features/components/ButtonVisualCustomizationEditor.test.tsx
          src/features/components/ButtonVisualPreviewMatrix.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          'src/app/[locale]/app/projects/[projectSlug]/components/page.tsx'
          --write
      - name: Run focused regression tests
        run: >-
          npx vitest run
          src/domain/design-system/component-template-registry.test.ts
          src/features/components/components-registry.utils.test.ts
          src/features/components/ButtonVisualCustomizationEditor.test.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Run typecheck
        run: npm run typecheck
      - name: Remove temporary workflows and commit
        run: |
          git rm .github/workflows/ds-181r-04-qa-fixes.yml
          git rm .github/workflows/ds-181r-04-qa-fixes-v2.yml
          git rm .github/workflows/ds-181r-04-qa-fixes-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: qualify focus states and initial component selection"
          git push origin HEAD:agent/ds-181r-04-textfield-customization
