name: DS-181R-03C format test

on:
  push:
    branches:
      - agent/ds-181r-03c-button-property-inspector
    paths:
      - .github/workflows/ds-181r-03c-format-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03c-button-property-inspector
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/components/ButtonVisualCustomizationEditor.test.tsx
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/ds-181r-03c-format-test.yml
          git config user.name "William Louis-Louisy"
          git config user.email "87181045+William-Louis-Louisy@users.noreply.github.com"
          git add -A
          git commit -m "style: format refined Button inspector test"
          git push origin HEAD:agent/ds-181r-03c-button-property-inspector
