name: DS-181R-04 apply only

on:
  push:
    branches:
      - agent/ds-181r-04-textfield-customization
    paths:
      - .github/workflows/ds-181r-04-apply-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-04-textfield-customization
          fetch-depth: 0
      - name: Apply R04 implementation
        run: python scripts/ds-181r-04-apply.py
      - name: Remove temporary assets
        run: git rm .github/workflows/ds-181r-04-apply.yml .github/workflows/ds-181r-04-apply-only.yml scripts/ds-181r-04-apply.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "feat: generalize V2 visual inspector to TextField"
          git push origin HEAD:agent/ds-181r-04-textfield-customization
