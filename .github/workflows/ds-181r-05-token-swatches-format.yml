name: DS-181R-05 token swatch format

on:
  push:
    branches:
      - agent/ds-181r-05-card-customization
    paths:
      - .github/workflows/ds-181r-05-token-swatches-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-05-card-customization
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format token swatch projection
        run: npx prettier --write src/features/components/ComponentContractEditorSections.tsx

      - name: Verify formatting
        run: npx prettier --check src/features/components/ComponentContractEditorSections.tsx

      - name: Remove helper and commit
        run: |
          git rm .github/workflows/ds-181r-05-token-swatches-format.yml
          git add src/features/components/ComponentContractEditorSections.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format token swatch projection"
          git push origin HEAD:agent/ds-181r-05-card-customization
