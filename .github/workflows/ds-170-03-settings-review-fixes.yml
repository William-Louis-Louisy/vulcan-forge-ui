name: DS-170-03 Settings Review Finalize

on:
  push:
    branches:
      - feature/ds-170-03-settings-redesign

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update settings translations
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const translations = {
            en: {
              account: {
                currentPassword: 'Current password',
                currentPasswordOptional: 'Only required when changing your email address.',
                currentPasswordRequired: 'Enter your current password to confirm the email change. You will be signed out afterwards.',
                description: 'Update the personal information associated with your account.',
                email: 'Email',
                emailDescription: 'Changing your login email requires your current password and signs you out.',
                errors: {
                  accountNotFound: 'Your account could not be found.',
                  currentPasswordIncorrect: 'The current password is incorrect.',
                  currentPasswordRequired: 'Enter your current password to change the email address.',
                  emailAlreadyUsed: 'Another account already uses this email address.',
                  invalidPayload: 'The submitted profile information is invalid.',
                  unauthorized: 'You must be signed in to update your profile.',
                  unexpected: 'Unable to update your profile. Please try again.',
                },
                name: 'Name',
                save: 'Save profile',
                saved: 'Profile information is up to date.',
                saving: 'Saving...',
                success: 'Profile information saved.',
                title: 'Personal information',
                unsaved: 'You have unsaved profile changes.',
                validation: {
                  currentPasswordIncorrect: 'The current password is incorrect.',
                  currentPasswordRequired: 'Enter your current password.',
                  emailAlreadyUsed: 'Another account already uses this email address.',
                  emailInvalid: 'Enter a valid email address.',
                  nameMinLength: 'Enter at least 2 characters.',
                  nameTooLong: 'Name must contain at most 80 characters.',
                },
              },
              danger: {
                confirmation: {
                  cancel: 'Cancel',
                  delete: 'Delete account permanently',
                  deleting: 'Deleting account...',
                  description: 'This action cannot be undone. Confirm your login email and current password before continuing.',
                  emailDescription: 'Type {email} exactly.',
                  emailLabel: 'Confirmation email',
                  passwordLabel: 'Current password',
                  title: 'Confirm permanent account deletion',
                },
                description: 'Permanently remove your account and every workspace, project and generated record owned by it.',
                errors: {
                  accountNotFound: 'Your account could not be found.',
                  confirmationEmailMismatch: 'The confirmation email does not match your account.',
                  currentPasswordIncorrect: 'The current password is incorrect.',
                  invalidPayload: 'Complete both confirmation fields.',
                  unauthorized: 'You must be signed in to delete your account.',
                  unexpected: 'Unable to delete your account. Please try again.',
                },
                request: 'Request account deletion',
                summary: 'Account deletion is immediate after confirmation. Owned workspaces and all related design-system data are deleted with the account.',
                title: 'Delete account',
                validation: {
                  confirmationEmailMismatch: 'Type the email address associated with this account.',
                  currentPasswordIncorrect: 'The current password is incorrect.',
                },
              },
            },
            fr: {
              account: {
                currentPassword: 'Mot de passe actuel',
                currentPasswordOptional: 'Requis uniquement pour modifier votre adresse email.',
                currentPasswordRequired: 'Saisissez votre mot de passe actuel pour confirmer le changement d’email. Vous serez ensuite déconnecté.',
                description: 'Modifiez les informations personnelles associées à votre compte.',
                email: 'Email',
                emailDescription: 'La modification de l’email de connexion nécessite votre mot de passe actuel et vous déconnecte.',
                errors: {
                  accountNotFound: 'Votre compte est introuvable.',
                  currentPasswordIncorrect: 'Le mot de passe actuel est incorrect.',
                  currentPasswordRequired: 'Saisissez votre mot de passe actuel pour modifier l’adresse email.',
                  emailAlreadyUsed: 'Un autre compte utilise déjà cette adresse email.',
                  invalidPayload: 'Les informations de profil envoyées sont invalides.',
                  unauthorized: 'Vous devez être connecté pour modifier votre profil.',
                  unexpected: 'Impossible de modifier votre profil. Veuillez réessayer.',
                },
                name: 'Nom',
                save: 'Sauvegarder le profil',
                saved: 'Les informations du profil sont à jour.',
                saving: 'Sauvegarde...',
                success: 'Informations du profil sauvegardées.',
                title: 'Informations personnelles',
                unsaved: 'Vous avez des modifications de profil non sauvegardées.',
                validation: {
                  currentPasswordIncorrect: 'Le mot de passe actuel est incorrect.',
                  currentPasswordRequired: 'Saisissez votre mot de passe actuel.',
                  emailAlreadyUsed: 'Un autre compte utilise déjà cette adresse email.',
                  emailInvalid: 'Saisissez une adresse email valide.',
                  nameMinLength: 'Saisissez au moins 2 caractères.',
                  nameTooLong: 'Le nom doit contenir au maximum 80 caractères.',
                },
              },
              danger: {
                confirmation: {
                  cancel: 'Annuler',
                  delete: 'Supprimer définitivement le compte',
                  deleting: 'Suppression du compte...',
                  description: 'Cette action est irréversible. Confirmez votre email de connexion et votre mot de passe actuel avant de continuer.',
                  emailDescription: 'Saisissez exactement {email}.',
                  emailLabel: 'Email de confirmation',
                  passwordLabel: 'Mot de passe actuel',
                  title: 'Confirmer la suppression définitive du compte',
                },
                description: 'Supprimez définitivement votre compte ainsi que chaque workspace, projet et donnée générée dont il est propriétaire.',
                errors: {
                  accountNotFound: 'Votre compte est introuvable.',
                  confirmationEmailMismatch: 'L’email de confirmation ne correspond pas à votre compte.',
                  currentPasswordIncorrect: 'Le mot de passe actuel est incorrect.',
                  invalidPayload: 'Complétez les deux champs de confirmation.',
                  unauthorized: 'Vous devez être connecté pour supprimer votre compte.',
                  unexpected: 'Impossible de supprimer votre compte. Veuillez réessayer.',
                },
                request: 'Demander la suppression du compte',
                summary: 'La suppression est immédiate après confirmation. Les workspaces possédés et toutes les données de design system associées sont supprimés avec le compte.',
                title: 'Supprimer le compte',
                validation: {
                  confirmationEmailMismatch: 'Saisissez l’adresse email associée à ce compte.',
                  currentPasswordIncorrect: 'Le mot de passe actuel est incorrect.',
                },
              },
            },
          };

          for (const [locale, values] of Object.entries(translations)) {
            const path = `src/messages/${locale}.json`;
            const messages = JSON.parse(fs.readFileSync(path, 'utf8'));
            messages.SettingsPage.account = values.account;
            messages.SettingsPage.danger = values.danger;
            fs.writeFileSync(path, `${JSON.stringify(messages, null, 2)}\n`);
          }
          NODE

      - name: Format changed sources
        run: >-
          npx prettier
          src/app/[locale]/app/settings/page.tsx
          src/app/[locale]/app/settings/loading.tsx
          src/features/settings/AccountProfileForm.tsx
          src/features/settings/DeleteAccountSection.tsx
          src/features/settings/SettingsForm.tsx
          src/features/settings/account-profile.schema.ts
          src/features/settings/delete-account.schema.ts
          src/features/settings/delete-account.state.ts
          src/features/settings/delete-account.action.ts
          src/features/settings/delete-account.action.test.ts
          src/features/settings/update-account-profile.state.ts
          src/features/settings/update-account-profile.action.ts
          src/features/settings/update-account-profile.action.test.ts
          src/messages/en.json
          src/messages/fr.json
          --write

      - name: Commit finalized sources
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/[locale]/app/settings src/features/settings src/messages/en.json src/messages/fr.json
          git commit -m "style(settings): finalize column layout and account controls"
          git push
