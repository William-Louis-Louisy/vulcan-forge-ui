name: DS-181R-03C density and template fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ds-181r-03c-button-property-inspector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply cohesive xs density and Button template defaults
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f'Expected anchor not found in {path_str}: {old[:80]!r}')
              path.write_text(source.replace(old, new, 1))

          # Shared Input: xs must exist whenever Select xs is used in the same inspector row.
          replace_once(
              'src/components/ui/Input.tsx',
              "export type InputSize = 'sm' | 'md';",
              "export type InputSize = 'xs' | 'sm' | 'md';",
          )
          replace_once(
              'src/components/ui/Input.tsx',
              "const sizeClassNames: Record<InputSize, string> = {\n  sm: 'min-h-9 px-3 py-1.5 text-xs',",
              "const sizeClassNames: Record<InputSize, string> = {\n  xs: 'min-h-7 px-2 py-1 text-xs',\n  sm: 'min-h-9 px-3 py-1.5 text-xs',",
          )

          # Shared Select: xs density applies to the dropdown surface/options too, not only the trigger.
          replace_once(
              'src/components/ui/Select.tsx',
              "const optionSizeClassNames: Record<SelectSize, string> = {\n  xs: 'min-h-8 px-2 py-1.5',\n  sm: 'min-h-9 px-2.5 py-1.5',\n  md: 'min-h-11 px-2.5 py-2',\n};",
              "const optionSizeClassNames: Record<SelectSize, string> = {\n  xs: 'min-h-7 px-2 py-1',\n  sm: 'min-h-9 px-2.5 py-1.5',\n  md: 'min-h-11 px-2.5 py-2',\n};\n\nconst listboxSizeClassNames: Record<SelectSize, string> = {\n  xs: 'p-0.5',\n  sm: 'p-1',\n  md: 'p-1',\n};",
          )
          replace_once(
              'src/components/ui/Select.tsx',
              '          className="border-border-subtle bg-surface-primary shadow-elevated z-50 max-h-72 overflow-y-auto rounded-md border p-1"',
              "          className={[\n            'border-border-subtle bg-surface-primary shadow-elevated z-50 max-h-72 overflow-y-auto rounded-md border',\n            listboxSizeClassNames[size],\n          ].join(' ')}",
          )

          # Button property inspector: every property-level value control uses the same xs density.
          editor = 'src/features/components/ButtonVisualCustomizationEditor.tsx'
          replacements = [
              (
                  "            placeholder={labels.selectToken}\n            size=\"sm\"\n          />",
                  "            placeholder={labels.selectToken}\n            size=\"xs\"\n          />",
              ),
              (
                  "            placeholder={labels.valuePlaceholder}\n            size=\"sm\"\n            textMode=\"technical\"",
                  "            placeholder={labels.valuePlaceholder}\n            size=\"xs\"\n            textMode=\"technical\"",
              ),
              (
                  "          placeholder={inheritedLabel}\n          size=\"sm\"\n        />",
                  "          placeholder={inheritedLabel}\n          size=\"xs\"\n        />",
              ),
              (
                  "              placeholder={labels.selectToken}\n              size=\"sm\"\n            />",
                  "              placeholder={labels.selectToken}\n              size=\"xs\"\n            />",
              ),
              (
                  "              placeholder={labels.fontWeight}\n              size=\"sm\"\n            />",
                  "              placeholder={labels.fontWeight}\n              size=\"xs\"\n            />",
              ),
              (
                  "              placeholder={labels.lineHeight}\n              size=\"sm\"\n            />",
                  "              placeholder={labels.lineHeight}\n              size=\"xs\"\n            />",
              ),
              (
                  "              placeholder={labels.textAlign}\n              size=\"sm\"\n            />",
                  "              placeholder={labels.textAlign}\n              size=\"xs\"\n            />",
              ),
              (
                  "        placeholder={placeholder}\n        size=\"sm\"\n      />",
                  "        placeholder={placeholder}\n        size=\"xs\"\n      />",
              ),
              (
                  '            <span className="text-content-tertiary flex min-h-9 items-center text-xs">',
                  '            <span className="text-content-tertiary flex min-h-7 items-center text-xs">',
              ),
              (
                  '          <span className="text-content-tertiary truncate text-xs">',
                  '          <span className="text-content-tertiary flex min-h-7 items-center truncate text-xs">',
              ),
          ]
          for old, new in replacements:
              replace_once(editor, old, new)

          # Button template: Primary is explicitly borderless at the template variant layer.
          registry = 'src/domain/design-system/component-template-registry.ts'
          replace_once(
              registry,
              "function createTemplateDefinition(\n  templateKey: WaveAComponentTemplateKey,\n): ComponentTemplateDefinition {\n  const legacySeed = getLegacySeed(templateKey);\n  const defaultContract = migrateLegacyComponentContract(legacySeed);",
              "function applyTemplateSpecificDefaults(\n  templateKey: WaveAComponentTemplateKey,\n  contract: ComponentContractV2,\n): ComponentContractV2 {\n  if (templateKey !== 'button') {\n    return contract;\n  }\n\n  const primaryDefaults = contract.overrides.variants.primary ?? {};\n\n  return componentContractV2Schema.parse({\n    ...contract,\n    overrides: {\n      ...contract.overrides,\n      variants: {\n        ...contract.overrides.variants,\n        primary: {\n          ...primaryDefaults,\n          border: {\n            ...primaryDefaults.border,\n            style: 'none',\n          },\n        },\n      },\n    },\n  });\n}\n\nfunction createTemplateDefinition(\n  templateKey: WaveAComponentTemplateKey,\n): ComponentTemplateDefinition {\n  const legacySeed = getLegacySeed(templateKey);\n  const defaultContract = applyTemplateSpecificDefaults(\n    templateKey,\n    migrateLegacyComponentContract(legacySeed),\n  );",
          )

          # Resolve template variant defaults before user-authored base/variant/size/state layers.
          preview = 'src/features/components/ButtonVisualPreviewMatrix.tsx'
          replace_once(
              preview,
              "                  const resolvedVisual = resolveComponentVisualProperties({\n                    ...(templateDefinition?.defaultContract.visual\n                      ? {\n                          templateDefaults:\n                            templateDefinition.defaultContract.visual,\n                        }\n                      : {}),\n                    base: contractV2.visual,\n                    overrides: contractV2.overrides,\n                    variantKey: variant.key,\n                    sizeKey: size.key,\n                    ...(stateKey ? { stateKey } : {}),\n                  });",
              "                  const templateResolvedVisual = templateDefinition\n                    ? resolveComponentVisualProperties({\n                        templateDefaults: templateDefinition.defaultContract.visual,\n                        overrides: templateDefinition.defaultContract.overrides,\n                        variantKey: variant.key,\n                        sizeKey: size.key,\n                        ...(stateKey ? { stateKey } : {}),\n                      })\n                    : {};\n                  const resolvedVisual = resolveComponentVisualProperties({\n                    templateDefaults: templateResolvedVisual,\n                    base: contractV2.visual,\n                    overrides: contractV2.overrides,\n                    variantKey: variant.key,\n                    sizeKey: size.key,\n                    ...(stateKey ? { stateKey } : {}),\n                  });",
          )

          # Regression: shared xs Input/Select density.
          density_test = 'src/components/ui/ControlDensity.test.tsx'
          replace_once(
              density_test,
              "describe('shared control density', () => {\n  it('aligns small inputs, selects and buttons to the compact editor density', () => {",
              "describe('shared control density', () => {\n  it('aligns extra-compact inputs and selects to the property-inspector density', () => {\n    render(\n      <>\n        <label htmlFor=\"extra-compact-input\">Extra compact input</label>\n        <Input id=\"extra-compact-input\" size=\"xs\" />\n        <label htmlFor=\"extra-compact-select\">Extra compact select</label>\n        <Select\n          id=\"extra-compact-select\"\n          value=\"ready\"\n          options={options}\n          onValueChange={() => undefined}\n          placeholder=\"Choose\"\n          size=\"xs\"\n        />\n      </>,\n    );\n\n    expect(\n      screen.getByRole('textbox', { name: 'Extra compact input' }),\n    ).toHaveClass('min-h-7');\n    expect(\n      screen.getByRole('combobox', { name: 'Extra compact select' }),\n    ).toHaveClass('min-h-7');\n  });\n\n  it('aligns small inputs, selects and buttons to the compact editor density', () => {",
          )

          # Regression: xs dropdown density follows xs trigger density.
          select_test = 'src/components/ui/Select.test.tsx'
          replace_once(
              select_test,
              "  it('supports a disabled state', () => {",
              "  it('densifies both the xs trigger and its dropdown options', async () => {\n    const user = userEvent.setup();\n\n    render(\n      <>\n        <label htmlFor=\"compact-token\">Compact token</label>\n        <Select\n          id=\"compact-token\"\n          value=\"color.semantic.background.app\"\n          options={options}\n          placeholder=\"Select a token\"\n          size=\"xs\"\n          onValueChange={() => undefined}\n        />\n      </>,\n    );\n\n    const combobox = screen.getByRole('combobox', { name: 'Compact token' });\n    expect(combobox).toHaveClass('min-h-7', 'px-2', 'py-1');\n\n    await user.click(combobox);\n\n    expect(screen.getByRole('listbox')).toHaveClass('p-0.5');\n    expect(\n      screen.getByRole('option', {\n        name: 'color.primitive.neutral.0 #ffffff',\n      }),\n    ).toHaveClass('min-h-7', 'px-2', 'py-1');\n  });\n\n  it('supports a disabled state', () => {",
          )

          # Regression: template default is explicit and variant-scoped.
          registry_test = 'src/domain/design-system/component-template-registry.test.ts'
          replace_once(
              registry_test,
              "  it('keeps renderer selection attached to the template rather than Component identity', () => {",
              "  it('keeps the Primary Button template borderless without imposing that default on Secondary', () => {\n    const buttonTemplate = getComponentTemplateDefinition('button');\n\n    expect(\n      buttonTemplate?.defaultContract.overrides.variants.primary?.border?.style,\n    ).toBe('none');\n    expect(\n      buttonTemplate?.defaultContract.overrides.variants.secondary?.border,\n    ).toBeUndefined();\n  });\n\n  it('keeps renderer selection attached to the template rather than Component identity', () => {",
          )

          # Regression: the actual Primary base preview consumes the template default.
          preview_test = 'src/features/components/ComponentFoundationsPreviewClient.test.tsx'
          replace_once(
              preview_test,
              "describe('ComponentFoundationsPreviewClient', () => {\n  it('updates the Button V2 matrix when the legacy editor publishes a visual token binding', async () => {",
              "describe('ComponentFoundationsPreviewClient', () => {\n  it('renders the Primary base Button template without a border', () => {\n    render(\n      <ComponentContractPreviewProvider\n        initialContract={contract}\n        initialContractV2={contractV2}\n      >\n        <ComponentFoundationsPreviewClient\n          locale=\"en\"\n          component={component}\n          rawTokenSets={rawTokenSets}\n        />\n      </ComponentContractPreviewProvider>,\n    );\n\n    const previewButton = screen.getByRole('button', { name: 'Button' });\n\n    expect(previewButton).toHaveStyle({ borderStyle: 'none' });\n    expect(previewButton).not.toHaveClass('border');\n  });\n\n  it('updates the Button V2 matrix when the legacy editor publishes a visual token binding', async () => {",
          )

          # Regression: Button value source, token value and explicit input all share xs density.
          editor_test = 'src/features/components/ButtonVisualCustomizationEditor.test.tsx'
          replace_once(
              editor_test,
              "describe('ButtonVisualCustomizationEditor', () => {\n  it('uses one uniform radius control until independent corners are enabled', async () => {",
              "describe('ButtonVisualCustomizationEditor', () => {\n  it('keeps property source, token value and explicit value controls on the same xs density', async () => {\n    const user = userEvent.setup();\n    const { container } = render(\n      <ButtonVisualCustomizationEditor {...createEditorProps()} />,\n    );\n\n    const radiusSource = screen.getByRole('combobox', { name: 'Radius' });\n    expect(radiusSource).toHaveClass('min-h-7');\n    expect(container.querySelector('input[id$=\"-explicit\"]')).toHaveClass(\n      'min-h-7',\n    );\n\n    await user.click(radiusSource);\n    await user.click(screen.getByRole('option', { name: 'Token' }));\n\n    expect(container.querySelector('button[id$=\"-token\"]')).toHaveClass(\n      'min-h-7',\n    );\n  });\n\n  it('uses one uniform radius control until independent corners are enabled', async () => {",
          )

      - name: Format touched files
        run: >-
          npx prettier
          src/components/ui/Input.tsx
          src/components/ui/Select.tsx
          src/components/ui/ControlDensity.test.tsx
          src/components/ui/Select.test.tsx
          src/features/components/ButtonVisualCustomizationEditor.tsx
          src/features/components/ButtonVisualCustomizationEditor.test.tsx
          src/features/components/ButtonVisualPreviewMatrix.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          src/domain/design-system/component-template-registry.ts
          src/domain/design-system/component-template-registry.test.ts
          --write

      - name: Run focused regression tests
        run: >-
          npx vitest run
          src/components/ui/ControlDensity.test.tsx
          src/components/ui/Select.test.tsx
          src/features/components/ButtonVisualCustomizationEditor.test.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          src/domain/design-system/component-template-registry.test.ts

      - name: Run strict typecheck
        run: npm run typecheck

      - name: Remove temporary workflow
        run: git rm .github/workflows/ds-181r-03c-density-template-fix.yml

      - name: Commit cohesive correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/ui/Input.tsx \
            src/components/ui/Select.tsx \
            src/components/ui/ControlDensity.test.tsx \
            src/components/ui/Select.test.tsx \
            src/features/components/ButtonVisualCustomizationEditor.tsx \
            src/features/components/ButtonVisualCustomizationEditor.test.tsx \
            src/features/components/ButtonVisualPreviewMatrix.tsx \
            src/features/components/ComponentFoundationsPreviewClient.test.tsx \
            src/domain/design-system/component-template-registry.ts \
            src/domain/design-system/component-template-registry.test.ts
          git commit -m "fix: align Button inspector density and primary template"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
