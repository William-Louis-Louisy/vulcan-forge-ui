name: DS-170-06 font token migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-font-tokens:
    if: github.head_ref == 'feature/ds-170-06-public-surfaces'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rename global font tokens
        run: |
          sed -i 's/--font-geist-sans/--font-inter-tight/g' 'src/app/[locale]/layout.tsx' src/app/globals.css
          sed -i 's/--font-geist-mono/--font-jetbrains-mono/g' 'src/app/[locale]/layout.tsx' src/app/globals.css
          npm run format

      - name: Commit font migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ds-170-06): migrate global font tokens"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
