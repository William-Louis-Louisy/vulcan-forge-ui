name: DS-170-07E Visual Tokens correction

on:
  push:
    branches:
      - feature/ds-170-07e-component-preview-role-bindings

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07e-component-preview-role-bindings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Visual Tokens correction
        run: node scripts/apply-ds-170-07e-visual-token-correction.mjs

      - name: Format corrected sources
        run: npm run format

      - name: Validate corrected implementation
        run: npm run quality

      - name: Remove temporary correction assets
        run: |
          rm scripts/apply-ds-170-07e-visual-token-correction.mjs
          rm .github/workflows/ds-170-07e-visual-token-correction.yml

      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ds-170-07e): restore Visual Tokens behavior"
          git push origin HEAD:feature/ds-170-07e-component-preview-role-bindings

# This update intentionally triggers the correction now that the workflow exists.
