name: DS-170-02 Review Fix Formatting

on:
  push:
    branches:
      - feature/ds-170-02-interactive-primitives-themes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format corrected files
        run: >-
          npx prettier
          docs/product/ds-170-02-interactive-primitives-themes-audit.md
          src/features/themes/PreviewPanel.tsx
          src/features/themes/PreviewPanel.test.tsx
          src/features/themes/ThemeTokenReferenceEditor.tsx
          src/features/themes/ThemeTokenReferenceEditor.test.tsx
          --write

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/product/ds-170-02-interactive-primitives-themes-audit.md \
            src/features/themes/PreviewPanel.tsx \
            src/features/themes/PreviewPanel.test.tsx \
            src/features/themes/ThemeTokenReferenceEditor.tsx \
            src/features/themes/ThemeTokenReferenceEditor.test.tsx
          git commit -m "style(themes): format QA corrections"
          git push
