name: DS-170-07 formatter

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'format visual debt implementation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ds-170-07): format visual debt implementation"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
