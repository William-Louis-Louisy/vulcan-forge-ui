name: DS-181R-03A Editor Cleanup

on:
  push:
    branches:
      - agent/ds-181r-03a-editor-taxonomy-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03a-editor-taxonomy-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Consolidate Button visual editor groups
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/components/ButtonVisualCustomizationEditor.tsx')
          text = path.read_text()

          text = text.replace(
              "type DesignValueGroupKey =\n  | 'dimensions'\n  | 'spacing'\n  | 'radius'\n  | 'border'\n  | 'surface';",
              "type DesignValueGroupKey =\n  | 'dimensions'\n  | 'spacing'\n  | 'radius'\n  | 'border';",
              1,
          )
          text = text.replace("\n  | 'background'\n  | 'foreground';", ";", 1)

          surface_group = re.compile(
              r"\n  \{\n    titleKey: 'surface',\n    properties: \[.*?\n    \],\n  \},(?=\n\];)",
              re.S,
          )
          text, count = surface_group.subn('', text, count=1)
          if count != 1:
              raise SystemExit('Expected exactly one surface descriptor group')

          map_tail = """            })}\n          </VisualGroup>\n        ))}"""
          border_control = """            })}\n            {group.titleKey === 'border' ? (\n              <SimpleSelectProperty\n                id=\"button-v2-border-style\"\n                label={t('properties.borderStyle')}\n                value={getButtonVisualProperty(draft, scope, 'border', 'style')}\n                options={(['none', 'solid', 'dashed', 'dotted'] as const).map(\n                  (value) => ({ value, label: t(`borderStyles.${value}`) }),\n                )}\n                inheritedLabel={\n                  scope.kind === 'base' ? t('templateDefault') : t('inherited')\n                }\n                resetLabel={t('reset')}\n                onChange={(value) =>\n                  updateDraft(\n                    setButtonVisualProperty(\n                      draft,\n                      scope,\n                      'border',\n                      'style',\n                      value,\n                    ),\n                  )\n                }\n                onReset={() =>\n                  updateDraft(\n                    resetButtonVisualProperty(draft, scope, 'border', 'style'),\n                  )\n                }\n              />\n            ) : null}\n          </VisualGroup>\n        ))}"""
          if map_tail not in text:
              raise SystemExit('Property group render tail not found')
          text = text.replace(map_tail, border_control, 1)

          duplicate_groups = re.compile(
              r"\n        <VisualGroup title=\{t\('groups\.border'\)\}>.*?\n        </VisualGroup>\n\n        <TypographyEditor",
              re.S,
          )
          text, count = duplicate_groups.subn('\n\n        <TypographyEditor', text, count=1)
          if count != 1:
              raise SystemExit('Expected duplicate Border/Surface block sequence')

          path.write_text(text)
          PY
      - name: Format editor
        run: npx prettier --write src/features/components/ButtonVisualCustomizationEditor.tsx
      - name: Commit editor cleanup
        run: |
          git add src/features/components/ButtonVisualCustomizationEditor.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: consolidate Button visual editor groups'
          git push origin HEAD:agent/ds-181r-03a-editor-taxonomy-cleanup
