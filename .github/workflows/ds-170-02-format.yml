name: DS-170-02 Formatting

on:
  push:
    branches:
      - feature/ds-170-02-interactive-primitives-themes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format DS-170-02 sources
        run: >-
          npx prettier
          src/components/ui/SegmentedControl.tsx
          src/components/ui/SegmentedControl.test.tsx
          src/components/ui/Select.tsx
          src/components/ui/Select.test.tsx
          src/components/ui/index.ts
          src/features/themes/ThemeSwitcher.tsx
          src/features/themes/ThemeTokenReferenceEditor.tsx
          src/features/themes/ThemeTokenReferenceEditor.test.tsx
          --write

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/ui/SegmentedControl.tsx \
            src/components/ui/SegmentedControl.test.tsx \
            src/components/ui/Select.tsx \
            src/components/ui/Select.test.tsx \
            src/components/ui/index.ts \
            src/features/themes/ThemeSwitcher.tsx \
            src/features/themes/ThemeTokenReferenceEditor.tsx \
            src/features/themes/ThemeTokenReferenceEditor.test.tsx
          git commit -m "style(ui): format interactive primitives"
          git push
