name: Format authentication audit

on:
  push:
    branches:
      - audit/ds-170-auth-signup-signin
    paths:
      - docs/product/ds-170-auth-signup-signin-audit.md
      - .github/workflows/format-auth-audit.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/ds-170-auth-signup-signin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format audit document
        run: npx prettier docs/product/ds-170-auth-signup-signin-audit.md --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/ds-170-auth-signup-signin-audit.md
          git commit -m "docs(auth): format signup and sign-in audit"
          git push origin HEAD:audit/ds-170-auth-signup-signin
