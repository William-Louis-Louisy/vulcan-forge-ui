name: DS-181R-03 Type Fix

on:
  push:
    branches:
      - agent/ds-181r-03-button-customization

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03-button-customization
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Apply strict TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          def replace_after(path: str, marker: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              marker_index = text.find(marker)
              if marker_index < 0:
                  raise SystemExit(f'Marker not found in {path}: {marker!r}')
              target_index = text.find(old, marker_index)
              if target_index < 0:
                  raise SystemExit(f'Expected snippet after marker not found in {path}: {old[:80]!r}')
              text = text[:target_index] + new + text[target_index + len(old):]
              file.write_text(text)

          editor = 'src/features/components/ButtonVisualCustomizationEditor.tsx'
          replace_once(
              editor,
              "          <Select<ButtonVisualScope['kind']>\n            value={scope.kind}",
              "          <Select<ButtonVisualScope['kind']>\n            id=\"button-v2-customization-scope\"\n            value={scope.kind}",
          )
          replace_once(
              editor,
              "            <Select\n              value={scope.key}",
              "            <Select\n              id=\"button-v2-customization-target\"\n              value={scope.key}",
          )
          replace_once(
              editor,
              "                <DesignValueField\n                  key={`${descriptor.group}:${descriptor.property}`}\n                  label=",
              "                <DesignValueField\n                  key={`${descriptor.group}:${descriptor.property}`}\n                  id={fieldId}\n                  label=",
          )
          replace_once(
              editor,
              "          <SimpleSelectProperty\n            label={t('properties.borderStyle')}",
              "          <SimpleSelectProperty\n            id=\"button-v2-border-style\"\n            label={t('properties.borderStyle')}",
          )
          replace_once(
              editor,
              "          <SimpleSelectProperty\n            label={t('properties.elevation')}",
              "          <SimpleSelectProperty\n            id=\"button-v2-elevation\"\n            label={t('properties.elevation')}",
          )
          replace_once(
              editor,
              "function DesignValueField({\n  label,",
              "function DesignValueField({\n  id,\n  label,",
          )
          replace_after(
              editor,
              "function DesignValueField({",
              "}: {\n  label: string;",
              "}: {\n  id: string;\n  label: string;",
          )
          replace_after(
              editor,
              "function DesignValueField({",
              "      <Select\n        value={source}",
              "      <Select\n        id={`${id}-source`}\n        value={source}",
          )
          replace_after(
              editor,
              "function DesignValueField({",
              "        <Select\n          value={getTokenPath(value)}",
              "        <Select\n          id={`${id}-token`}\n          value={getTokenPath(value)}",
          )
          replace_after(
              editor,
              "function DesignValueField({",
              "        <Input\n          value={explicitValue}",
              "        <Input\n          id={`${id}-explicit`}\n          value={explicitValue}",
          )
          replace_once(editor, '          textMode="code"', '          textMode="technical"')

          replace_once(
              editor,
              "function SimpleSelectProperty({\n  label,",
              "function SimpleSelectProperty({\n  id,\n  label,",
          )
          replace_after(
              editor,
              "function SimpleSelectProperty({",
              "}: {\n  label: string;",
              "}: {\n  id: string;\n  label: string;",
          )
          replace_after(
              editor,
              "function SimpleSelectProperty({",
              "      <Select\n        value={resolvedValue}",
              "      <Select\n        id={id}\n        value={resolvedValue}",
          )

          replace_after(
              editor,
              "function TypographyEditor({",
              "        <Select\n          value={source}",
              "        <Select\n          id=\"button-v2-typography-source\"\n          value={source}",
          )
          replace_after(
              editor,
              "function TypographyEditor({",
              "          <Select\n            value={value.path}",
              "          <Select\n            id=\"button-v2-typography-token\"\n            value={value.path}",
          )
          replace_after(
              editor,
              "function TypographyEditor({",
              "              <Select\n                value={String(explicit.fontWeight ?? 600)}",
              "              <Select\n                id=\"button-v2-typography-font-weight\"\n                value={String(explicit.fontWeight ?? 600)}",
          )
          replace_after(
              editor,
              "function TypographyEditor({",
              "              <Select\n                value={String(explicit.lineHeight ?? 1.2)}",
              "              <Select\n                id=\"button-v2-typography-line-height\"\n                value={String(explicit.lineHeight ?? 1.2)}",
          )
          replace_after(
              editor,
              "function TypographyEditor({",
              "              <Select\n                value={explicit.textAlign ?? 'center'}",
              "              <Select\n                id=\"button-v2-typography-text-align\"\n                value={explicit.textAlign ?? 'center'}",
          )

          replace_once(
              'src/features/components/ComponentContractEditorBoundary.test.tsx',
              '        componentId="button-id"\n        locale="en"',
              '        componentId="button-id"\n        componentKey="button"\n        locale="en"',
          )
          replace_once(
              'src/features/components/ComponentContractEditorBoundary.test.tsx',
              '        componentId="text-field-id"\n        locale="en"',
              '        componentId="text-field-id"\n        componentKey="textField"\n        locale="en"',
          )

          replace_once(
              'src/features/components/ButtonVisualPreviewMatrix.tsx',
              "                    templateDefaults:\n                      templateDefinition?.defaultContract.visual,\n                    base: contractV2.visual,",
              "                    ...(templateDefinition?.defaultContract.visual\n                      ? {\n                          templateDefaults:\n                            templateDefinition.defaultContract.visual,\n                        }\n                      : {}),\n                    base: contractV2.visual,",
          )

          replace_once(
              'src/features/components/button-visual-customization.utils.ts',
              '  return isRecord(groupValue) ? groupValue[property] : undefined;',
              '  return isRecord(groupValue)\n    ? (groupValue as Record<string, unknown>)[property]\n    : undefined;',
          )

          preview_utils = 'src/features/components/component-visual-preview.utils.ts'
          replace_once(
              preview_utils,
              "function resolveTypographyDesignValue(\n",
              "function resolveStringDesignValue(\n  value: unknown,\n  resolveToken: TokenResolver,\n): string | undefined {\n  const resolved = resolvePrimitiveDesignValue(value, resolveToken);\n  return typeof resolved === 'string' ? resolved : undefined;\n}\n\nfunction resolveTypographyDesignValue(\n",
          )
          replace_once(
              preview_utils,
              '    borderColor: resolvePrimitiveDesignValue(border?.color, resolveToken),',
              '    borderColor: resolveStringDesignValue(border?.color, resolveToken),',
          )
          replace_once(
              preview_utils,
              "    backgroundColor: resolvePrimitiveDesignValue(\n      surface?.background,\n      resolveToken,\n    ),",
              "    backgroundColor: resolveStringDesignValue(\n      surface?.background,\n      resolveToken,\n    ),",
          )
          replace_once(
              preview_utils,
              '    color: resolvePrimitiveDesignValue(surface?.foreground, resolveToken),',
              '    color: resolveStringDesignValue(surface?.foreground, resolveToken),',
          )

          intl_types = 'src/types/next-intl.d.ts'
          replace_once(
              intl_types,
              "import type { componentPreviewMessages } from '../messages/component-preview-messages';\n",
              "import type { componentPreviewMessages } from '../messages/component-preview-messages';\nimport type { componentV2CustomizationMessages } from '../messages/component-v2-customization-messages';\n",
          )
          replace_once(
              intl_types,
              "type ComponentMessages = DeepMerge<\n  (typeof componentGuidelineMessages)['en'],\n  (typeof componentPreviewMessages)['en']\n>;",
              "type ComponentMessages = DeepMerge<\n  DeepMerge<\n    (typeof componentGuidelineMessages)['en'],\n    (typeof componentPreviewMessages)['en']\n  >,\n  (typeof componentV2CustomizationMessages)['en']\n>;",
          )
          PY
      - name: Format strict type fixes
        run: |
          npx prettier --write \
            src/features/components/ButtonVisualCustomizationEditor.tsx \
            src/features/components/ButtonVisualPreviewMatrix.tsx \
            src/features/components/ComponentContractEditorBoundary.test.tsx \
            src/features/components/button-visual-customization.utils.ts \
            src/features/components/component-visual-preview.utils.ts \
            src/types/next-intl.d.ts
      - name: Verify typecheck
        run: npm run typecheck
      - name: Commit fixes
        run: |
          git add src/features/components src/types/next-intl.d.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: satisfy strict Button customization contracts'
          git push origin HEAD:agent/ds-181r-03-button-customization
