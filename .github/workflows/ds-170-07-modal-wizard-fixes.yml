name: DS-170-07 modal and wizard QA fixes

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'enforce bottom-sheet modal conventions') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Apply QA fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              content = file.read_text()
              if old not in content:
                  raise SystemExit(f'Expected block not found in {path}: {old[:160]!r}')
              file.write_text(content.replace(old, new, count))

          Path('src/features/settings/ThemePreferenceInitScript.tsx').write_text("""import { themePreferenceStorageKey } from './theme-preference.client';

export function ThemePreferenceInitScript() {
  const script = `
(function () {
  try {
    var storageKey = ${JSON.stringify(themePreferenceStorageKey)};
    var storedPreference = window.localStorage.getItem(storageKey);
    var themePreference =
      storedPreference === 'dark' ||
      storedPreference === 'light' ||
      storedPreference === 'system'
        ? storedPreference
        : 'system';

    var resolvedTheme =
      themePreference === 'system'
        ? window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        : themePreference;

    var root = document.documentElement;

    root.classList.toggle('dark', resolvedTheme === 'dark');
    root.dataset.themePreference = themePreference;
    root.dataset.theme = resolvedTheme;
    root.style.colorScheme = resolvedTheme;
  } catch {
  }
})();
`;

  return (
    <script
      id="theme-preference-init"
      dangerouslySetInnerHTML={{ __html: script }}
    />
  );
}
""")

          Path('src/components/ui/Dialog.tsx').write_text("""'use client';

import {
  useEffect,
  useRef,
  type MouseEvent,
  type ReactNode,
} from 'react';

export type DialogSize = 'md' | 'lg';

export type DialogProps = {
  open: boolean;
  onClose: () => void;
  ariaLabel: string;
  children: ReactNode;
  size?: DialogSize;
};

export type DialogActionsProps = {
  children: ReactNode;
};

const sizeClassNames: Record<DialogSize, string> = {
  md: 'sm:max-w-xl',
  lg: 'sm:max-w-3xl',
};

export function Dialog({
  open,
  onClose,
  ariaLabel,
  children,
  size = 'md',
}: DialogProps) {
  const dialogRef = useRef<HTMLDialogElement>(null);
  const returnFocusRef = useRef<HTMLElement | null>(null);

  useEffect(() => {
    const dialogElement = dialogRef.current;

    if (!dialogElement) {
      return;
    }

    if (open) {
      if (dialogElement.open) {
        return;
      }

      returnFocusRef.current =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;
      dialogElement.showModal();

      requestAnimationFrame(() => {
        if (!dialogElement.open) {
          return;
        }

        dialogElement
          .querySelector<HTMLElement>(
            '[autofocus], input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"])',
          )
          ?.focus();
      });

      return;
    }

    if (dialogElement.open) {
      dialogElement.close();
    }

    returnFocusRef.current?.focus();
  }, [open]);

  function handleBackdropClick(event: MouseEvent<HTMLDialogElement>) {
    if (event.target === event.currentTarget) {
      event.currentTarget.close();
    }
  }

  return (
    <dialog
      ref={dialogRef}
      aria-label={ariaLabel}
      onClose={onClose}
      onClick={handleBackdropClick}
      className={[
        'backdrop:bg-overlay-scrim fixed inset-x-0 top-auto bottom-0 m-0 max-h-[calc(100dvh-0.5rem)] w-full max-w-none overflow-y-auto overscroll-contain border-0 bg-transparent p-0 shadow-2xl',
        'sm:inset-auto sm:m-auto sm:max-h-[calc(100dvh-2rem)] sm:w-[calc(100%-2rem)]',
        '[&>form]:mt-0 [&>form]:rounded-t-xl sm:[&>form]:rounded-xl',
        sizeClassNames[size],
      ].join(' ')}
    >
      {children}
    </dialog>
  );
}

export function DialogActions({ children }: DialogActionsProps) {
  return (
    <div className="border-border-subtle bg-surface-primary sticky bottom-0 -mx-5 mt-6 grid grid-cols-2 gap-3 border-t px-5 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:-mx-6 sm:flex sm:justify-end sm:px-6 sm:pb-5">
      {children}
    </div>
  );
}
""")

