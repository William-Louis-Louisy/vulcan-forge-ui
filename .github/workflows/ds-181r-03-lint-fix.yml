name: DS-181R-03 Lint Fix

on:
  push:
    branches:
      - agent/ds-181r-03-button-customization

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03-button-customization
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Remove effect state cascade and follow live semantic axes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/components/ButtonVisualCustomizationEditor.tsx')
          text = path.read_text()
          text = text.replace(
              "  useMemo,\n  useState,",
              "  useMemo,\n  useRef,\n  useState,",
          )
          text = text.replace(
              "  const previewContext = useComponentContractPreview();\n",
              "  const previewContext = useComponentContractPreview();\n  const lastRefreshedSavedContractRef = useRef<string | null>(null);\n",
          )
          old_effect = """  useEffect(() => {\n    if (state.status !== 'success' || !state.savedContract) {\n      return;\n    }\n\n    setDraft(state.savedContract);\n    previewContext?.setContractV2(state.savedContract);\n    router.refresh();\n  }, [previewContext, router, state]);\n\n  const scopeTargetKeys = useMemo(\n    () => getScopeKeys(semanticContract, scope.kind),\n    [scope.kind, semanticContract],\n  );\n"""
          new_effect = """  useEffect(() => {\n    if (state.status !== 'success' || !state.savedContract) {\n      return;\n    }\n\n    const savedFingerprint = createButtonVisualCustomizationFingerprint(\n      state.savedContract,\n    );\n\n    if (lastRefreshedSavedContractRef.current === savedFingerprint) {\n      return;\n    }\n\n    lastRefreshedSavedContractRef.current = savedFingerprint;\n    router.refresh();\n  }, [router, state.savedContract, state.status]);\n\n  const liveSemanticContract = previewContext?.contract ?? semanticContract;\n  const scopeTargetKeys = useMemo(\n    () => getScopeKeys(liveSemanticContract, scope.kind),\n    [liveSemanticContract, scope.kind],\n  );\n"""
          if old_effect not in text:
              raise SystemExit('Expected effect block not found')
          text = text.replace(old_effect, new_effect)
          text = text.replace(
              "    const firstKey = getScopeKeys(semanticContract, kind)[0];",
              "    const firstKey = getScopeKeys(liveSemanticContract, kind)[0];",
          )
          path.write_text(text)
          PY
      - name: Format edited file
        run: npx prettier src/features/components/ButtonVisualCustomizationEditor.tsx --write
      - name: Commit fix
        run: |
          git add src/features/components/ButtonVisualCustomizationEditor.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: avoid Button visual save effect cascade'
          git push origin HEAD:agent/ds-181r-03-button-customization
