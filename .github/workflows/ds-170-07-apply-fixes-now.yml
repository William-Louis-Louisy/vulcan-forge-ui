name: DS-170-07 apply QA corrections

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'enforce bottom-sheet modal conventions') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Extract and apply approved correction script
        run: |
          awk '
            /^          python <<'\''PY'\''$/ { capture = 1; next }
            /^          PY$/ { capture = 0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/ds-170-07-modal-wizard-fixes.yml > /tmp/apply-ds-170-07.py
          python /tmp/apply-ds-170-07.py
          npm run format
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(ds-170-07): enforce bottom-sheet modal conventions"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
