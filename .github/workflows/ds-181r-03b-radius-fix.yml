name: DS-181R-03B Radius Fix

on:
  push:
    branches:
      - agent/ds-181r-03b-border-radius-correctness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03b-border-radius-correctness
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Apply deterministic radius semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('src/domain/design-system/component-contract-v2.schema.ts')
          text = schema.read_text()
          marker = 'function mergeVisualProperties(\n'
          helper = '''function mergeRadiusProperties(\n  base: ComponentVisualProperties['radius'],\n  override: ComponentVisualProperties['radius'],\n): ComponentVisualProperties['radius'] {\n  if (!override) {\n    return base;\n  }\n\n  if (!base) {\n    return override;\n  }\n\n  if (!override.radius) {\n    return componentRadiusSchema.parse({ ...base, ...override });\n  }\n\n  return componentRadiusSchema.parse({\n    radius: override.radius,\n    ...(override.topLeft ? { topLeft: override.topLeft } : {}),\n    ...(override.topRight ? { topRight: override.topRight } : {}),\n    ...(override.bottomRight ? { bottomRight: override.bottomRight } : {}),\n    ...(override.bottomLeft ? { bottomLeft: override.bottomLeft } : {}),\n  });\n}\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('mergeVisualProperties marker not found')
              text = text.replace(marker, helper + marker, 1)

          old_radius = '''    radius:\n      base.radius || override.radius\n        ? { ...base.radius, ...override.radius }\n        : undefined,'''
          new_radius = '''    radius: mergeRadiusProperties(base.radius, override.radius),'''
          if old_radius in text:
              text = text.replace(old_radius, new_radius, 1)
          elif new_radius not in text:
              raise SystemExit('radius merge block not found')
          schema.write_text(text)

          preview = Path('src/features/components/component-visual-preview.utils.ts')
          text = preview.read_text()
          marker = 'function resolveTypographyDesignValue(\n'
          helper = '''function createRadiusCssProperties(\n  radius: ComponentVisualProperties['radius'],\n  resolveToken: TokenResolver,\n): Pick<\n  CSSProperties,\n  | 'borderRadius'\n  | 'borderTopLeftRadius'\n  | 'borderTopRightRadius'\n  | 'borderBottomRightRadius'\n  | 'borderBottomLeftRadius'\n> {\n  const uniform = resolvePrimitiveDesignValue(radius?.radius, resolveToken);\n  const hasCornerValue = Boolean(\n    radius &&\n      (radius.topLeft !== undefined ||\n        radius.topRight !== undefined ||\n        radius.bottomRight !== undefined ||\n        radius.bottomLeft !== undefined),\n  );\n\n  if (!hasCornerValue) {\n    return { borderRadius: uniform };\n  }\n\n  const resolveCorner = (\n    value: ComponentVisualProperties['radius'] extends infer Radius\n      ? Radius extends { topLeft?: infer Corner }\n        ? Corner\n        : never\n      : never,\n  ) =>\n    value === undefined\n      ? uniform\n      : resolvePrimitiveDesignValue(value, resolveToken);\n\n  return {\n    borderTopLeftRadius: resolveCorner(radius?.topLeft),\n    borderTopRightRadius: resolveCorner(radius?.topRight),\n    borderBottomRightRadius: resolveCorner(radius?.bottomRight),\n    borderBottomLeftRadius: resolveCorner(radius?.bottomLeft),\n  };\n}\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('preview helper marker not found')
              text = text.replace(marker, helper + marker, 1)

          old_compute = '''  const radius = visual.radius;\n  const surface = visual.surface;'''
          new_compute = '''  const radius = visual.radius;\n  const radiusStyles = createRadiusCssProperties(radius, resolveToken);\n  const surface = visual.surface;'''
          if old_compute in text:
              text = text.replace(old_compute, new_compute, 1)
          elif new_compute not in text:
              raise SystemExit('radius compute marker not found')

          old_styles = '''    borderRadius: resolvePrimitiveDesignValue(radius?.radius, resolveToken),\n    borderTopLeftRadius: resolvePrimitiveDesignValue(\n      radius?.topLeft,\n      resolveToken,\n    ),\n    borderTopRightRadius: resolvePrimitiveDesignValue(\n      radius?.topRight,\n      resolveToken,\n    ),\n    borderBottomRightRadius: resolvePrimitiveDesignValue(\n      radius?.bottomRight,\n      resolveToken,\n    ),\n    borderBottomLeftRadius: resolvePrimitiveDesignValue(\n      radius?.bottomLeft,\n      resolveToken,\n    ),'''
          if old_styles in text:
              text = text.replace(old_styles, '    ...radiusStyles,', 1)
          elif '    ...radiusStyles,' not in text:
              raise SystemExit('radius style projection block not found')
          preview.write_text(text)
          PY
      - name: Add focused radius regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/design-system/component-contract-v2.schema.test.ts')
          text = path.read_text()
          anchor = '\n  it(\'resets one override property back to inherited behavior\''
          tests = '''\n  it('treats a higher-layer uniform radius as shorthand that replaces inherited corners', () => {\n    const resolved = resolveComponentVisualProperties({\n      templateDefaults: {\n        radius: {\n          radius: { source: 'value', value: '8px' },\n          topLeft: { source: 'value', value: '16px' },\n        },\n      },\n      overrides: {\n        variants: {\n          primary: {\n            radius: {\n              radius: { source: 'value', value: '4px' },\n              bottomRight: { source: 'value', value: '12px' },\n            },\n          },\n        },\n        sizes: {},\n        states: {},\n      },\n      variantKey: 'primary',\n    });\n\n    expect(resolved.radius).toEqual({\n      radius: { source: 'value', value: '4px' },\n      bottomRight: { source: 'value', value: '12px' },\n    });\n  });\n\n  it('preserves inherited radius corners when a higher layer changes only another corner', () => {\n    const resolved = resolveComponentVisualProperties({\n      templateDefaults: {\n        radius: { radius: { source: 'value', value: '8px' } },\n      },\n      base: {\n        radius: { topLeft: { source: 'value', value: '16px' } },\n      },\n      overrides: {\n        variants: {\n          primary: {\n            radius: { topRight: { source: 'value', value: '4px' } },\n          },\n        },\n        sizes: {},\n        states: {},\n      },\n      variantKey: 'primary',\n    });\n\n    expect(resolved.radius).toEqual({\n      radius: { source: 'value', value: '8px' },\n      topLeft: { source: 'value', value: '16px' },\n      topRight: { source: 'value', value: '4px' },\n    });\n  });\n'''
          if "treats a higher-layer uniform radius as shorthand" not in text:
              if anchor not in text:
                  raise SystemExit('domain test anchor not found')
              text = text.replace(anchor, tests + anchor, 1)
          path.write_text(text)

          path = Path('src/features/components/component-visual-preview.utils.test.ts')
          text = path.read_text()
          tests = '''\n\n  it('projects mixed uniform and per-corner radius through corner longhands only', () => {\n    const styles = createComponentVisualCssProperties({\n      visual: {\n        radius: {\n          radius: { source: 'value', value: '8px' },\n          topLeft: { source: 'value', value: '18px' },\n          bottomRight: { source: 'value', value: '32px' },\n        },\n      },\n      rawTokenSets: [],\n    });\n\n    expect(styles.borderRadius).toBeUndefined();\n    expect(styles).toMatchObject({\n      borderTopLeftRadius: '18px',\n      borderTopRightRadius: '8px',\n      borderBottomRightRadius: '32px',\n      borderBottomLeftRadius: '8px',\n    });\n  });\n\n  it('keeps the CSS radius shorthand when no corner override exists', () => {\n    const styles = createComponentVisualCssProperties({\n      visual: {\n        radius: { radius: { source: 'value', value: '10px' } },\n      },\n      rawTokenSets: [],\n    });\n\n    expect(styles.borderRadius).toBe('10px');\n    expect(styles.borderTopLeftRadius).toBeUndefined();\n    expect(styles.borderTopRightRadius).toBeUndefined();\n    expect(styles.borderBottomRightRadius).toBeUndefined();\n    expect(styles.borderBottomLeftRadius).toBeUndefined();\n  });\n'''
          if 'projects mixed uniform and per-corner radius' not in text:
              head, tail = text.rsplit('\n});', 1)
              text = head + tests + '\n});' + tail
          path.write_text(text)

          path = Path('src/features/components/button-visual-customization.utils.test.ts')
          text = path.read_text()
          tests = '''\n\n  it('resetting a corner keeps the authored uniform radius intact', () => {\n    let contract = createButtonContract();\n    contract = setButtonVisualProperty(\n      contract,\n      { kind: 'base' },\n      'radius',\n      'radius',\n      { source: 'value', value: '8px' },\n    );\n    contract = setButtonVisualProperty(\n      contract,\n      { kind: 'base' },\n      'radius',\n      'topLeft',\n      { source: 'value', value: '18px' },\n    );\n    contract = resetButtonVisualProperty(\n      contract,\n      { kind: 'base' },\n      'radius',\n      'topLeft',\n    );\n\n    expect(\n      getButtonVisualProperty(contract, { kind: 'base' }, 'radius', 'topLeft'),\n    ).toBeUndefined();\n    expect(\n      getButtonVisualProperty(contract, { kind: 'base' }, 'radius', 'radius'),\n    ).toEqual({ source: 'value', value: '8px' });\n  });\n'''
          if 'resetting a corner keeps the authored uniform radius intact' not in text:
              head, tail = text.rsplit('\n});', 1)
              text = head + tests + '\n});' + tail
          path.write_text(text)
          PY
      - name: Format focused files
        run: npx prettier --write src/domain/design-system/component-contract-v2.schema.ts src/domain/design-system/component-contract-v2.schema.test.ts src/features/components/component-visual-preview.utils.ts src/features/components/component-visual-preview.utils.test.ts src/features/components/button-visual-customization.utils.test.ts docs/product/ds-181r-03b-border-radius-correctness.md
      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://vulcan:vulcan@localhost:5432/vulcan?schema=public
      - name: Run focused tests
        run: npx vitest run src/domain/design-system/component-contract-v2.schema.test.ts src/features/components/component-visual-preview.utils.test.ts src/features/components/button-visual-customization.utils.test.ts
      - name: Commit radius fix
        run: |
          git add src/domain/design-system/component-contract-v2.schema.ts src/domain/design-system/component-contract-v2.schema.test.ts src/features/components/component-visual-preview.utils.ts src/features/components/component-visual-preview.utils.test.ts src/features/components/button-visual-customization.utils.test.ts docs/product/ds-181r-03b-border-radius-correctness.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make Button radius resolution deterministic'
          git push origin HEAD:agent/ds-181r-03b-border-radius-correctness
