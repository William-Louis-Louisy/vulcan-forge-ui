name: DS-170-08A selection source commit

on:
  push:
    branches:
      - feature/ds-170-08a-token-editor-reliability
    paths:
      - .github/workflows/ds-170-08a-selection-commit.yml

permissions:
  contents: write

jobs:
  commit-selection-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ds-170-08a-token-editor-reliability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Apply token selection fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file_path = Path(path)
              text = file_path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {text.count(old)}')
              file_path.write_text(text.replace(old, new, 1))

          utils_path = 'src/features/tokens/editor/tokens-editor-shell.utils.ts'
          replace_once(
              utils_path,
              "import type { TokenRowData, TokenSetType } from '../tokens-editor.utils';\n",
              """import {\n  isEditablePrimitiveColorTokenRow,\n  isEditableSemanticColorTokenRow,\n  type TokenRowData,\n  type TokenSetType,\n} from '../tokens-editor.utils';\n\nexport type PendingTokenRename = {\n  currentTokenPath: string;\n  nextTokenPath: string;\n};\n\nfunction compareNaturally(firstValue: string, secondValue: string) {\n  return firstValue.localeCompare(secondValue, undefined, {\n    numeric: true,\n    sensitivity: 'base',\n  });\n}\n\nfunction getColorTokenNamespace(path: string) {\n  return path.split('.')[2] ?? 'base';\n}\n\nfunction formatTokenNamespaceLabel(namespace: string) {\n  return namespace\n    .split(/[-_]/)\n    .filter(Boolean)\n    .map((segment) => segment[0]?.toUpperCase() + segment.slice(1))\n    .join(' ');\n}\n\nfunction getTokenDisplayGroupSortKey(row: TokenRowData) {\n  if (isEditablePrimitiveColorTokenRow(row)) {\n    return {\n      order: 0,\n      label: formatTokenNamespaceLabel(getColorTokenNamespace(row.path)),\n    };\n  }\n\n  if (isEditableSemanticColorTokenRow(row)) {\n    return {\n      order: 1,\n      label: formatTokenNamespaceLabel(getColorTokenNamespace(row.path)),\n    };\n  }\n\n  return {\n    order: 2,\n    label: '',\n  };\n}\n\nexport function sortTokenRowsForDisplay(rows: TokenRowData[]) {\n  return [...rows].sort((firstRow, secondRow) => {\n    const firstGroup = getTokenDisplayGroupSortKey(firstRow);\n    const secondGroup = getTokenDisplayGroupSortKey(secondRow);\n\n    return (\n      firstGroup.order - secondGroup.order ||\n      compareNaturally(firstGroup.label, secondGroup.label) ||\n      compareNaturally(firstRow.path, secondRow.path)\n    );\n  });\n}\n""",
          )

          old_resolver = """export function resolveSelectedToken({\n  activeRows,\n  filteredRows,\n  selectedTokenPath,\n}: {\n  activeRows: TokenRowData[];\n  filteredRows: TokenRowData[];\n  selectedTokenPath: string | null;\n}) {\n  return (\n    activeRows.find((row) => row.path === selectedTokenPath) ??\n    filteredRows[0] ??\n    activeRows[0] ??\n    null\n  );\n}\n"""
          new_resolver = """export function resolveSelectedToken({\n  activeRows,\n  filteredRows,\n  selectedTokenPath,\n  pendingRename = null,\n}: {\n  activeRows: TokenRowData[];\n  filteredRows: TokenRowData[];\n  selectedTokenPath: string | null;\n  pendingRename?: PendingTokenRename | null;\n}) {\n  const directlySelectedToken = activeRows.find(\n    (row) => row.path === selectedTokenPath,\n  );\n\n  if (directlySelectedToken) {\n    return directlySelectedToken;\n  }\n\n  if (\n    pendingRename &&\n    pendingRename.currentTokenPath === selectedTokenPath\n  ) {\n    const renamedToken = activeRows.find(\n      (row) => row.path === pendingRename.nextTokenPath,\n    );\n\n    if (renamedToken) {\n      return renamedToken;\n    }\n\n    const sourceToken = activeRows.find(\n      (row) => row.path === pendingRename.currentTokenPath,\n    );\n\n    if (sourceToken) {\n      return sourceToken;\n    }\n  }\n\n  return filteredRows[0] ?? activeRows[0] ?? null;\n}\n"""
          replace_once(utils_path, old_resolver, new_resolver)

          shell_path = 'src/features/tokens/editor/TokensEditorShell.tsx'
          replace_once(
              shell_path,
              """import {\n  filterTokenRows,\n  createTokenEditorUrl,\n  getNextSelectedTokenPathAfterDeletion,\n  resolveSelectedToken,\n} from './tokens-editor-shell.utils';\n""",
              """import {\n  filterTokenRows,\n  createTokenEditorUrl,\n  getNextSelectedTokenPathAfterDeletion,\n  resolveSelectedToken,\n  sortTokenRowsForDisplay,\n  type PendingTokenRename,\n} from './tokens-editor-shell.utils';\n""",
          )
          replace_once(
              shell_path,
              "import { useMemo, useState } from 'react';",
              "import { useEffect, useMemo, useState } from 'react';",
          )
          replace_once(
              shell_path,
              """  const [createTokenFormType, setCreateTokenFormType] =\n    useState<TokenSetType | null>(null);\n""",
              """  const [createTokenFormType, setCreateTokenFormType] =\n    useState<TokenSetType | null>(null);\n  const [pendingTokenRename, setPendingTokenRename] =\n    useState<PendingTokenRename | null>(null);\n""",
          )
          replace_once(
              shell_path,
              """  const filteredTokenRows = useMemo(() => {\n    if (!activeTokenSet) {\n      return [];\n    }\n\n    return filterTokenRows({\n      rows: activeTokenSet.rows,\n      query: tokenSearchQuery,\n    });\n  }, [activeTokenSet, tokenSearchQuery]);\n\n  const selectedToken = resolveSelectedToken({\n    activeRows: activeTokenSet?.rows ?? [],\n    filteredRows: filteredTokenRows,\n    selectedTokenPath,\n  });\n""",
              """  const orderedActiveTokenRows = useMemo(\n    () => sortTokenRowsForDisplay(activeTokenSet?.rows ?? []),\n    [activeTokenSet],\n  );\n\n  const filteredTokenRows = useMemo(\n    () =>\n      filterTokenRows({\n        rows: orderedActiveTokenRows,\n        query: tokenSearchQuery,\n      }),\n    [orderedActiveTokenRows, tokenSearchQuery],\n  );\n\n  const selectedToken = resolveSelectedToken({\n    activeRows: orderedActiveTokenRows,\n    filteredRows: filteredTokenRows,\n    selectedTokenPath,\n    pendingRename: pendingTokenRename,\n  });\n""",
          )
          marker = """  const primitiveColorAliasOptions = useMemo(\n    () => getPrimitiveColorTokenAliasOptions(activeTokenSet?.rows ?? []),\n    [activeTokenSet],\n  );\n\n"""
          insertion = marker + """  const pendingRenameSourceExists =\n    pendingTokenRename !== null &&\n    orderedActiveTokenRows.some(\n      (row) => row.path === pendingTokenRename.currentTokenPath,\n    );\n  const pendingRenameTargetExists =\n    pendingTokenRename !== null &&\n    orderedActiveTokenRows.some(\n      (row) => row.path === pendingTokenRename.nextTokenPath,\n    );\n\n  useEffect(() => {\n    if (\n      !pendingTokenRename ||\n      !pendingRenameTargetExists ||\n      pendingRenameSourceExists\n    ) {\n      return;\n    }\n\n    const nextTokenPath = pendingTokenRename.nextTokenPath;\n\n    setSelectedTokenPath(nextTokenPath);\n    setPendingTokenRename(null);\n\n    window.history.replaceState(\n      null,\n      '',\n      createTokenEditorUrl({\n        pathname: window.location.pathname,\n        tokenSetType: activeTokenSetType,\n        tokenPath: nextTokenPath,\n        tokenSearchQuery,\n      }),\n    );\n  }, [\n    activeTokenSetType,\n    pendingRenameSourceExists,\n    pendingRenameTargetExists,\n    pendingTokenRename,\n    tokenSearchQuery,\n  ]);\n\n"""
          replace_once(shell_path, marker, insertion)
          replace_once(
              shell_path,
              """    const nextSelectedTokenPath = nextTokenSet?.rows[0]?.path ?? null;\n""",
              """    const nextSelectedTokenPath =\n      sortTokenRowsForDisplay(nextTokenSet?.rows ?? [])[0]?.path ?? null;\n""",
          )
          replace_once(
              shell_path,
              """  function handleTokenSelect(tokenPath: string) {\n    setSelectedTokenPath(tokenPath);\n""",
              """  function handleTokenSelect(tokenPath: string) {\n    setPendingTokenRename(null);\n    setSelectedTokenPath(tokenPath);\n""",
          )
          replace_once(
              shell_path,
              """  function handleTokenRenamed(nextTokenPath: string) {\n    setSelectedTokenPath(nextTokenPath);\n\n    updateUrl({\n      token: nextTokenPath,\n    });\n  }\n""",
              """  function handleTokenRenamed(nextTokenPath: string) {\n    if (!orderedActiveTokenRows.some((row) => row.path === nextTokenPath)) {\n      return;\n    }\n\n    setSelectedTokenPath(nextTokenPath);\n    setPendingTokenRename(null);\n\n    updateUrl({\n      token: nextTokenPath,\n    });\n  }\n\n  function handleTokenRenameStarted(rename: PendingTokenRename) {\n    setPendingTokenRename(rename);\n  }\n\n  function handleTokenRenameFailed(currentTokenPath: string) {\n    setPendingTokenRename((pendingRename) =>\n      pendingRename?.currentTokenPath === currentTokenPath\n        ? null\n        : pendingRename,\n    );\n  }\n""",
          )
          replace_once(
              shell_path,
              """    setCreateTokenFormType(null);\n    setActiveTokenSetType(tokenSetType);\n""",
              """    setCreateTokenFormType(null);\n    setPendingTokenRename(null);\n    setActiveTokenSetType(tokenSetType);\n""",
          )
          replace_once(
              shell_path,
              """  function handleTokenValueUpdated(tokenPath: string) {\n    setSelectedTokenPath(tokenPath);\n""",
              """  function handleTokenValueUpdated(tokenPath: string) {\n    setPendingTokenRename(null);\n    setSelectedTokenPath(tokenPath);\n""",
          )
          replace_once(
              shell_path,
              """    const nextTokenPath = getNextSelectedTokenPathAfterDeletion({\n      rows: activeTokenSet?.rows ?? [],\n""",
              """    const nextTokenPath = getNextSelectedTokenPathAfterDeletion({\n      rows: orderedActiveTokenRows,\n""",
          )
          replace_once(
              shell_path,
              """    setSelectedTokenPath(nextTokenPath);\n    updateUrl({\n      set: activeTokenSetType,\n      token: nextTokenPath,\n      q: tokenSearchQuery,\n    });\n  }\n\n  const selectedTokenSetType""",
              """    setPendingTokenRename(null);\n    setSelectedTokenPath(nextTokenPath);\n    updateUrl({\n      set: activeTokenSetType,\n      token: nextTokenPath,\n      q: tokenSearchQuery,\n    });\n  }\n\n  const selectedTokenSetType""",
          )
          replace_once(
              shell_path,
              """          onTokenRenamed={handleTokenRenamed}\n          onTokenValueUpdated={handleTokenValueUpdated}\n""",
              """          onTokenRenamed={handleTokenRenamed}\n          onTokenRenameStarted={handleTokenRenameStarted}\n          onTokenRenameFailed={handleTokenRenameFailed}\n          onTokenValueUpdated={handleTokenValueUpdated}\n""",
          )

          inspector_path = 'src/features/tokens/editor/TokenInspectorPanel.tsx'
          replace_once(
              inspector_path,
              """  onTokenRenamed?: (nextTokenPath: string) => void;\n  onTokenValueUpdated: (tokenPath: string) => void;\n""",
              """  onTokenRenamed?: (nextTokenPath: string) => void;\n  onTokenRenameStarted: (rename: {\n    currentTokenPath: string;\n    nextTokenPath: string;\n  }) => void;\n  onTokenRenameFailed: (currentTokenPath: string) => void;\n  onTokenValueUpdated: (tokenPath: string) => void;\n""",
          )
          replace_once(
              inspector_path,
              """  onTokenRenamed,\n  onTokenValueUpdated,\n""",
              """  onTokenRenamed,\n  onTokenRenameStarted,\n  onTokenRenameFailed,\n  onTokenValueUpdated,\n""",
          )
          replace_once(
              inspector_path,
              """          {...(onTokenRenamed ? { onRenamed: onTokenRenamed } : {})}\n        />\n""",
              """          {...(onTokenRenamed ? { onRenamed: onTokenRenamed } : {})}\n          onRenameStarted={onTokenRenameStarted}\n          onRenameFailed={onTokenRenameFailed}\n        />\n""",
          )

          rename_path = 'src/features/tokens/TokenRenameForm.tsx'
          replace_once(
              rename_path,
              """  onRenamed?: (nextTokenPath: string) => void;\n};\n""",
              """  onRenamed?: (nextTokenPath: string) => void;\n  onRenameStarted?: (rename: {\n    currentTokenPath: string;\n    nextTokenPath: string;\n  }) => void;\n  onRenameFailed?: (currentTokenPath: string) => void;\n};\n""",
          )
          replace_once(
              rename_path,
              """  labels,\n  onRenamed,\n}: TokenRenameFormProps) {\n""",
              """  labels,\n  onRenamed,\n  onRenameStarted,\n  onRenameFailed,\n}: TokenRenameFormProps) {\n""",
          )
          replace_once(
              rename_path,
              """  useEffect(() => {\n    if (state.status === 'success') {\n      onRenamed?.(state.values.nextTokenPath);\n    }\n  }, [onRenamed, state.status, state.values.nextTokenPath]);\n""",
              """  useEffect(() => {\n    if (state.status === 'success') {\n      onRenamed?.(state.values.nextTokenPath);\n    }\n\n    if (state.status === 'error') {\n      onRenameFailed?.(currentTokenPath);\n    }\n  }, [\n    currentTokenPath,\n    onRenameFailed,\n    onRenamed,\n    state.status,\n    state.values.nextTokenPath,\n  ]);\n""",
          )
          replace_once(
              rename_path,
              """  function handleSubmitCapture() {\n    markCurrentDraftSubmitted();\n    preserveSaveContext();\n  }\n""",
              """  function handleSubmitCapture() {\n    onRenameStarted?.({\n      currentTokenPath,\n      nextTokenPath: draftTokenPath.trim(),\n    });\n    markCurrentDraftSubmitted();\n    preserveSaveContext();\n  }\n""",
          )

          test_path = 'src/features/tokens/editor/tokens-editor-shell.utils.test.ts'
          replace_once(
              test_path,
              """import {\n  getNextSelectedTokenPathAfterDeletion,\n  resolveSelectedToken,\n} from './tokens-editor-shell.utils';\n\nfunction createRow(path: string, value: string): TokenRowData {\n  return {\n    id: path,\n    path,\n    type: 'spacing',\n    value,\n    rawValue: value,\n    isColorValue: false,\n""",
              """import {\n  getNextSelectedTokenPathAfterDeletion,\n  resolveSelectedToken,\n  sortTokenRowsForDisplay,\n} from './tokens-editor-shell.utils';\n\nfunction createRow(\n  path: string,\n  value: string,\n  type = 'spacing',\n): TokenRowData {\n  return {\n    id: path,\n    path,\n    type,\n    value,\n    rawValue: value,\n    isColorValue: type === 'color' && value.startsWith('#'),\n""",
          )
          test_file = Path(test_path)
          test_text = test_file.read_text()
          anchor = """  it('selects a stable neighboring token after deletion', () => {\n"""
          additions = """  it('keeps the renamed token selected while refreshed rows replace the old path', () => {\n    const sourcePath = 'spacing.old';\n    const targetPath = 'spacing.renamed';\n    const pendingRename = {\n      currentTokenPath: sourcePath,\n      nextTokenPath: targetPath,\n    };\n    const beforeRename = [\n      createRow(sourcePath, '1rem'),\n      createRow('spacing.other', '2rem'),\n    ];\n    const afterRename = [\n      createRow(targetPath, '1rem'),\n      createRow('spacing.other', '2rem'),\n    ];\n\n    expect(\n      resolveSelectedToken({\n        activeRows: beforeRename,\n        filteredRows: beforeRename,\n        selectedTokenPath: sourcePath,\n        pendingRename,\n      })?.path,\n    ).toBe(sourcePath);\n\n    expect(\n      resolveSelectedToken({\n        activeRows: afterRename,\n        filteredRows: afterRename,\n        selectedTokenPath: sourcePath,\n        pendingRename,\n      })?.path,\n    ).toBe(targetPath);\n  });\n\n  it('orders the default selection exactly like the visible color-token list', () => {\n    const unorderedRows = [\n      createRow(\n        'color.semantic.background.primary',\n        '{color.primitive.brand.500}',\n        'color',\n      ),\n      createRow('color.primitive.neutral.100', '#f5f5f5', 'color'),\n      createRow('color.primitive.brand.500', '#6366f1', 'color'),\n    ];\n\n    expect(sortTokenRowsForDisplay(unorderedRows).map((row) => row.path)).toEqual([\n      'color.primitive.brand.500',\n      'color.primitive.neutral.100',\n      'color.semantic.background.primary',\n    ]);\n  });\n\n"""
          if test_text.count(anchor) != 1:
              raise SystemExit('test insertion anchor changed')
          test_file.write_text(test_text.replace(anchor, additions + anchor, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format touched files
        run: >-
          npx prettier --write
          src/features/tokens/editor/tokens-editor-shell.utils.ts
          src/features/tokens/editor/tokens-editor-shell.utils.test.ts
          src/features/tokens/editor/TokensEditorShell.tsx
          src/features/tokens/editor/TokenInspectorPanel.tsx
          src/features/tokens/TokenRenameForm.tsx

      - name: Run focused selection tests
        run: npm run test -- src/features/tokens/editor/tokens-editor-shell.utils.test.ts

      - name: Commit selection fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/tokens/editor/tokens-editor-shell.utils.ts \
            src/features/tokens/editor/tokens-editor-shell.utils.test.ts \
            src/features/tokens/editor/TokensEditorShell.tsx \
            src/features/tokens/editor/TokenInspectorPanel.tsx \
            src/features/tokens/TokenRenameForm.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(tokens): preserve selection across rename and initial load"
          git push origin HEAD:feature/ds-170-08a-token-editor-reliability
