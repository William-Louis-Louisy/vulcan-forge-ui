name: Format DS-170-07D

on:
  push:
    branches:
      - feature/ds-170-07d-professional-color-authoring

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07d-professional-color-authoring

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/features/tokens/color-picker.utils.test.ts \
            src/features/tokens/color-picker.utils.ts \
            src/features/tokens/ColorPickerField.tsx \
            src/features/tokens/CreateColorTokenForm.tsx \
            src/features/tokens/PrimitiveColorTokenEditor.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/tokens/color-picker.utils.test.ts \
            src/features/tokens/color-picker.utils.ts \
            src/features/tokens/ColorPickerField.tsx \
            src/features/tokens/CreateColorTokenForm.tsx \
            src/features/tokens/PrimitiveColorTokenEditor.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format DS-170-07D files"
          git push
