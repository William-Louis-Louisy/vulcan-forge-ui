name: DS-170-07C Format

on:
  push:
    branches:
      - feature/ds-170-07c-project-deletion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07c-project-deletion
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: >-
          npx prettier
          "src/app/[locale]/app/projects/[projectSlug]/settings/page.tsx"
          src/messages/project-settings-messages.ts
          src/types/next-intl.d.ts
          --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/[locale]/app/projects/[projectSlug]/settings/page.tsx" \
            src/messages/project-settings-messages.ts \
            src/types/next-intl.d.ts
          git commit -m "style(ds-170-07c): format project deletion files"
          git push origin HEAD:feature/ds-170-07c-project-deletion
