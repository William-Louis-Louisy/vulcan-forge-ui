name: Apply DS-160-07-A2b

on:
  push:
    branches:
      - feature/ds-160-07a2b-accessibility-score
    paths:
      - .github/workflows/apply-ds-160-07a2b.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Apply score explanation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file_path.write_text(content.replace(old, new), encoding='utf-8')

          Path('src/features/accessibility/accessibility-score.ts').write_text(r'''export const ACCESSIBILITY_SCORE_BASE = 100;

export const ACCESSIBILITY_SCORE_PENALTIES = {
  critical: 25,
  warning: 10,
} as const;

export type AccessibilityScoreBreakdown = {
  baseScore: number;
  criticalIssues: number;
  warningIssues: number;
  criticalPenalty: number;
  warningPenalty: number;
  totalPenalty: number;
  rawScore: number;
  score: number;
  isFloored: boolean;
};

export function createAccessibilityScoreBreakdown({
  criticalIssues,
  warningIssues,
}: {
  criticalIssues: number;
  warningIssues: number;
}): AccessibilityScoreBreakdown {
  const criticalPenalty =
    criticalIssues * ACCESSIBILITY_SCORE_PENALTIES.critical;
  const warningPenalty = warningIssues * ACCESSIBILITY_SCORE_PENALTIES.warning;
  const totalPenalty = criticalPenalty + warningPenalty;
  const rawScore = ACCESSIBILITY_SCORE_BASE - totalPenalty;

  return {
    baseScore: ACCESSIBILITY_SCORE_BASE,
    criticalIssues,
    warningIssues,
    criticalPenalty,
    warningPenalty,
    totalPenalty,
    rawScore,
    score: Math.max(0, rawScore),
    isFloored: rawScore < 0,
  };
}
''', encoding='utf-8')

