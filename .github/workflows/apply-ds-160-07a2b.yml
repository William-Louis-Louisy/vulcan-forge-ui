          Path('src/features/accessibility/AccessibilityScoreExplanation.tsx').write_text(r''''use client';

import { InfoIcon, XIcon } from '@phosphor-icons/react';
import { useEffect, useId, useRef, useState } from 'react';
import type { AccessibilityScoreBreakdown } from './accessibility-score';

export type AccessibilityScoreExplanationLabels = {
  trigger: string;
  title: string;
  description: string;
  formula: string;
  baseScore: string;
  criticalIssues: string;
  warningIssues: string;
  totalPenalty: string;
  currentScore: string;
  floorNotice: string;
  disclaimer: string;
  close: string;
};

type AccessibilityScoreExplanationProps = {
  breakdown: AccessibilityScoreBreakdown;
  labels: AccessibilityScoreExplanationLabels;
};

export function AccessibilityScoreExplanation({
  breakdown,
  labels,
}: AccessibilityScoreExplanationProps) {
  const [isOpen, setIsOpen] = useState(false);
  const panelId = useId();
  const titleId = useId();
  const rootRef = useRef<HTMLDivElement>(null);
  const triggerRef = useRef<HTMLButtonElement>(null);

  useEffect(() => {
    if (!isOpen) {
      return;
    }

    function closeOnOutsidePointer(event: PointerEvent) {
      if (
        event.target instanceof Node &&
        !rootRef.current?.contains(event.target)
      ) {
        setIsOpen(false);
      }
    }

    function closeOnEscape(event: KeyboardEvent) {
      if (event.key !== 'Escape') {
        return;
      }

      setIsOpen(false);
      triggerRef.current?.focus();
    }

    document.addEventListener('pointerdown', closeOnOutsidePointer);
    document.addEventListener('keydown', closeOnEscape);

    return () => {
      document.removeEventListener('pointerdown', closeOnOutsidePointer);
      document.removeEventListener('keydown', closeOnEscape);
    };
  }, [isOpen]);

  return (
    <div ref={rootRef} className="relative inline-flex">
      <button
        ref={triggerRef}
        type="button"
        aria-expanded={isOpen}
        aria-controls={panelId}
        aria-haspopup="dialog"
        title={labels.trigger}
        onClick={() => setIsOpen((current) => !current)}
        className="border-border-subtle bg-background-subtle text-content-secondary hover:border-border-strong hover:text-content-primary focus-visible:outline-border-focus inline-flex size-6 items-center justify-center rounded-full border transition focus-visible:outline-2 focus-visible:outline-offset-2"
      >
        <InfoIcon aria-hidden="true" size={14} weight="bold" />
        <span className="sr-only">{labels.trigger}</span>
      </button>

      {isOpen ? (
        <section
          id={panelId}
          role="dialog"
          aria-labelledby={titleId}
          className="border-border-subtle bg-surface-primary absolute top-8 left-0 z-30 w-[min(21rem,calc(100vw-2rem))] rounded-md border p-4 shadow-lg"
        >
          <header className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <h3 id={titleId} className="text-sm font-semibold tracking-tight">
                {labels.title}
              </h3>
              <p className="text-content-secondary mt-1 text-xs leading-5">
                {labels.description}
              </p>
            </div>
            <button
              type="button"
              aria-label={labels.close}
              onClick={() => {
                setIsOpen(false);
                triggerRef.current?.focus();
              }}
              className="text-content-tertiary hover:bg-background-subtle hover:text-content-primary focus-visible:outline-border-focus -m-1 inline-flex size-7 shrink-0 items-center justify-center rounded-sm transition focus-visible:outline-2 focus-visible:outline-offset-2"
            >
              <XIcon aria-hidden="true" size={14} weight="bold" />
            </button>
          </header>

          <p className="border-border-subtle bg-background-subtle text-content-secondary mt-3 rounded-sm border px-3 py-2 font-mono text-[0.6875rem] leading-5">
            {labels.formula}
          </p>

          <dl className="mt-3 grid gap-2 text-xs">
            <ScoreBreakdownRow
              label={labels.baseScore}
              value={String(breakdown.baseScore)}
            />
            <ScoreBreakdownRow
              label={labels.criticalIssues}
              value={`−${breakdown.criticalPenalty}`}
            />
            <ScoreBreakdownRow
              label={labels.warningIssues}
              value={`−${breakdown.warningPenalty}`}
            />
            <ScoreBreakdownRow
              label={labels.totalPenalty}
              value={`−${breakdown.totalPenalty}`}
              emphasized
            />
            <ScoreBreakdownRow
              label={labels.currentScore}
              value={`${breakdown.score}/100`}
              emphasized
            />
          </dl>

          {breakdown.isFloored ? (
            <p className="text-action-warning mt-3 text-xs leading-5 font-semibold">
              {labels.floorNotice}
            </p>
          ) : null}

          <p className="text-content-tertiary border-border-subtle mt-3 border-t pt-3 text-xs leading-5">
            {labels.disclaimer}
          </p>
        </section>
      ) : null}
    </div>
  );
}

function ScoreBreakdownRow({
  label,
  value,
  emphasized = false,
}: {
  label: string;
  value: string;
  emphasized?: boolean;
}) {
  return (
    <div
      className={[
        'flex items-baseline justify-between gap-4',
        emphasized ? 'text-content-primary font-semibold' : '',
      ]
        .filter(Boolean)
        .join(' ')}
    >
      <dt className="text-content-secondary">{label}</dt>
      <dd className="shrink-0 font-mono">{value}</dd>
    </div>
  );
}
''', encoding='utf-8')

          Path('src/features/accessibility/AccessibilityScoreExplanation.test.tsx').write_text(r'''import userEvent from '@testing-library/user-event';
import { render, screen } from '@testing-library/react';
import { describe, expect, it } from 'vitest';
import { createAccessibilityScoreBreakdown } from './accessibility-score';
import { AccessibilityScoreExplanation } from './AccessibilityScoreExplanation';

const labels = {
  trigger: 'Explain the indicative score',
  title: 'How the score is calculated',
  description: 'The score starts at 100.',
  formula: '100 − (critical issues × 25) − (warnings × 10)',
  baseScore: 'Starting score',
  criticalIssues: '4 critical issues',
  warningIssues: '3 warnings',
  totalPenalty: 'Total deduction',
  currentScore: 'Displayed score',
  floorNotice: 'The raw result is -30. The displayed score is floored at 0.',
  disclaimer: 'This is not a percentage of WCAG compliance.',
  close: 'Close score explanation',
};

describe('AccessibilityScoreExplanation', () => {
  it('opens an accessible score breakdown and closes it with Escape', async () => {
    const user = userEvent.setup();

    render(
      <AccessibilityScoreExplanation
        breakdown={createAccessibilityScoreBreakdown({
          criticalIssues: 4,
          warningIssues: 3,
        })}
        labels={labels}
      />,
    );

    const trigger = screen.getByRole('button', { name: labels.trigger });

    expect(
      screen.queryByRole('dialog', { name: labels.title }),
    ).not.toBeInTheDocument();

    await user.click(trigger);

    expect(
      screen.getByRole('dialog', { name: labels.title }),
    ).toBeInTheDocument();
    expect(screen.getByText('−100')).toBeInTheDocument();
    expect(screen.getByText('−30')).toBeInTheDocument();
    expect(screen.getByText('−130')).toBeInTheDocument();
    expect(screen.getByText('0/100')).toBeInTheDocument();
    expect(screen.getByText(labels.floorNotice)).toBeInTheDocument();

    await user.keyboard('{Escape}');

    expect(
      screen.queryByRole('dialog', { name: labels.title }),
    ).not.toBeInTheDocument();
    expect(trigger).toHaveFocus();
  });

  it('does not show a floor notice when the raw score remains positive', async () => {
    const user = userEvent.setup();

    render(
      <AccessibilityScoreExplanation
        breakdown={createAccessibilityScoreBreakdown({
          criticalIssues: 1,
          warningIssues: 1,
        })}
        labels={labels}
      />,
    );

    await user.click(
      screen.getByRole('button', {
        name: labels.trigger,
      }),
    );

    expect(screen.getByText('65/100')).toBeInTheDocument();
    expect(screen.queryByText(labels.floorNotice)).not.toBeInTheDocument();
  });
});
''', encoding='utf-8')

          Path('docs/product/ds-160-07a2b-accessibility-score-audit.md').write_text(r'''# DS-160-07-A2b — Accessibility score explanation audit

## Objective

Make the automated accessibility score understandable without changing its formula or implying that it represents WCAG compliance.

DS-160-07-A2 expanded the number of token, component and theme issues included in the report. Projects can consequently reach the score floor more quickly even when their contrast results have not changed.

## Current formula

The score currently uses fixed issue penalties:

```txt
100 - (critical issues × 25) - (warnings × 10)
```

The displayed score cannot be lower than zero.

This means that:

- four critical issues are enough to display `0/100`;
- additional issues can produce a negative raw value while the visible score remains zero;
- the score is a prioritization signal, not a percentage of successful checks;
- `0/100` does not mean that the design system is `0%` WCAG compliant.

## UI clarification

Add an information control beside the indicative-score label in the validation summary.

The control must:

- open on click or keyboard activation;
- expose its expanded state and controlled panel;
- close from its dedicated close action, Escape or an outside pointer action;
- return focus to its trigger after keyboard dismissal;
- show the fixed formula;
- show the current critical and warning counts;
- show each penalty, the total penalty and displayed score;
- expose the negative raw result when the visible score has been floored;
- repeat that the score is not a WCAG compliance percentage or certification.

## Domain clarification

Centralize the base score and penalty values in a dedicated accessibility-score module. The report generator and explanatory UI must consume the same breakdown so the displayed explanation cannot drift from the calculation.

## Non-goals

- no score-formula redesign;
- no weighting by rule family or affected item count;
- no manual checklist;
- no WCAG certification claim;
- no persistence-schema change;
- no report-history comparison.

## Acceptance targets

- a `0/100` score can be explained from the visible issue counts;
- the formula and current deductions are available in FR and EN;
- mouse, touch and keyboard users can open the explanation;
- Escape dismissal restores focus to the trigger;
- the score generator and UI use the same constants and breakdown;
- the existing report score and status thresholds remain unchanged;
- unit and component tests cover normal and floored scores;
- `npm run format` and `npm run quality` pass before merge.
''', encoding='utf-8')

