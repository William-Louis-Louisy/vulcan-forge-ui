name: Apply auth password integration

on:
  push:
    branches:
      - feature/ds-170-auth-02-passwords

permissions:
  contents: write

concurrency:
  group: apply-auth-password-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-02-passwords

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update localized password messages
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const updates = {
            en: {
              passwordHelp:
                'Use 15 to 128 characters. Spaces and passphrases are allowed.',
              validation: {
                passwordInvalidUnicode:
                  'The password contains invalid text characters.',
                passwordMinLength:
                  'Password must contain at least 15 characters.',
                passwordTooLong:
                  'Password must contain at most 128 characters.',
                passwordCompromised:
                  'Choose a different password. This one appears in known data breaches.',
                passwordCheckUnavailable:
                  "We can't verify password safety right now. Please try again later.",
                passwordHashingUnavailable:
                  'Secure password storage is temporarily unavailable. Please try again later.',
              },
            },
            fr: {
              passwordHelp:
                'Utilisez entre 15 et 128 caractères. Les espaces et les phrases de passe sont autorisés.',
              validation: {
                passwordInvalidUnicode:
                  'Le mot de passe contient des caractères de texte invalides.',
                passwordMinLength:
                  'Le mot de passe doit contenir au moins 15 caractères.',
                passwordTooLong:
                  'Le mot de passe doit contenir au maximum 128 caractères.',
                passwordCompromised:
                  'Choisissez un autre mot de passe. Celui-ci apparaît dans des fuites de données connues.',
                passwordCheckUnavailable:
                  'La sécurité du mot de passe ne peut pas être vérifiée pour le moment. Veuillez réessayer plus tard.',
                passwordHashingUnavailable:
                  'Le stockage sécurisé des mots de passe est temporairement indisponible. Veuillez réessayer plus tard.',
              },
            },
          };

          for (const [locale, update] of Object.entries(updates)) {
            const path = `src/messages/${locale}.json`;
            const messages = JSON.parse(fs.readFileSync(path, 'utf8'));
            messages.SignupPage.form.passwordHelp = update.passwordHelp;
            Object.assign(messages.SignupPage.validation, update.validation);
            fs.writeFileSync(path, `${JSON.stringify(messages, null, 2)}\n`);
          }
          NODE

      - name: Format authentication integration
        run: >-
          npx prettier
          src/features/auth/signup/signup.action.ts
          src/features/auth/signup/signup.action.test.ts
          src/features/auth/signup/signup.schema.ts
          src/features/auth/signup/signup.schema.test.ts
          src/features/auth/signup/signup.state.ts
          src/features/settings/delete-account.action.ts
          src/features/settings/delete-account.action.test.ts
          src/features/settings/update-account-profile.action.ts
          src/features/settings/update-account-profile.action.test.ts
          src/server/auth/auth-security-events.ts
          src/server/auth/credentials-authorizer.ts
          src/server/auth/credentials-authorizer.test.ts
          src/server/auth/password/password.constants.ts
          src/server/auth/password/password.service.test.ts
          src/messages/en.json
          src/messages/fr.json
          --write

      - name: Commit applied integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore(auth): format and localize password integration"
          git push origin HEAD:feature/ds-170-auth-02-passwords
