name: Apply AUTH-04 foundation

on:
  push:
    branches:
      - feature/ds-170-auth-04-password-recovery

permissions:
  contents: write

concurrency:
  group: apply-auth04-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vulcan
          POSTGRES_PASSWORD: vulcan_dev_password
          POSTGRES_DB: vulcan_forge_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulcan -d vulcan_forge_ui"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public
      RUN_AUTH_DATABASE_TESTS: 'true'
      AUTH_RATE_LIMIT_SECRET: integration-rate-limit-secret
      AUTH_TRUST_PROXY_HEADERS: 'false'
      AUTH_RATE_LIMIT_FAIL_OPEN: 'false'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-04-password-recovery

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply password recovery foundation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function write(filePath, content) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
            fs.writeFileSync(filePath, content.replace(/^\n/, ''));
          }

          function replaceExact(filePath, before, after) {
            const content = fs.readFileSync(filePath, 'utf8');

            if (!content.includes(before)) {
              throw new Error(`Expected content not found in ${filePath}: ${before}`);
            }

            fs.writeFileSync(filePath, content.replace(before, after));
          }

          replaceExact(
            'prisma/schema.prisma',
            '  emailVerifiedAt DateTime?\n  imageUrl        String?',
            '  emailVerifiedAt DateTime?\n  authVersion     Int       @default(0)\n  imageUrl        String?',
          );

          replaceExact(
            'prisma/schema.prisma',
            '  emailVerificationToken EmailVerificationToken?\n}',
            '  emailVerificationToken EmailVerificationToken?\n  passwordResetToken      PasswordResetToken?\n}',
          );

          replaceExact(
            'prisma/schema.prisma',
            'model Workspace {',
            `model PasswordResetToken {
  id        String   @id @default(cuid())
  userId    String   @unique
  tokenHash String   @unique
  expiresAt DateTime
  createdAt DateTime @default(now())

  user User @relation(fields: [userId], references: [id], onDelete: Cascade)

  @@index([expiresAt])
}

model Workspace {`,
          );

          write(
            'prisma/migrations/20260806103000_add_password_recovery/migration.sql',
            `-- AlterTable
ALTER TABLE "User" ADD COLUMN "authVersion" INTEGER NOT NULL DEFAULT 0;

-- CreateTable
CREATE TABLE "PasswordResetToken" (
    "id" TEXT NOT NULL,
    "userId" TEXT NOT NULL,
    "tokenHash" TEXT NOT NULL,
    "expiresAt" TIMESTAMP(3) NOT NULL,
    "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,

    CONSTRAINT "PasswordResetToken_pkey" PRIMARY KEY ("id")
);

-- CreateIndex
CREATE UNIQUE INDEX "PasswordResetToken_userId_key" ON "PasswordResetToken"("userId");

-- CreateIndex
CREATE UNIQUE INDEX "PasswordResetToken_tokenHash_key" ON "PasswordResetToken"("tokenHash");

-- CreateIndex
CREATE INDEX "PasswordResetToken_expiresAt_idx" ON "PasswordResetToken"("expiresAt");

-- AddForeignKey
ALTER TABLE "PasswordResetToken" ADD CONSTRAINT "PasswordResetToken_userId_fkey" FOREIGN KEY ("userId") REFERENCES "User"("id") ON DELETE CASCADE ON UPDATE CASCADE;
`,
          );

          replaceExact(
            'src/server/auth/auth-rate-limit.ts',
            "export type AuthRateLimitOperation = 'emailVerification' | 'login' | 'signup';",
            `export type AuthRateLimitOperation =
  | 'emailVerification'
  | 'login'
  | 'passwordRecoveryRequest'
  | 'passwordResetAttempt'
  | 'signup';`,
          );

          replaceExact(
            'src/server/auth/auth-rate-limit.ts',
            `  login: {
    account: {
      limit: 8,
      windowMs: 15 * minute,
    },
    ip: {
      limit: 40,
      windowMs: 15 * minute,
    },
  },
  signup: {`,
            `  login: {
    account: {
      limit: 8,
      windowMs: 15 * minute,
    },
    ip: {
      limit: 40,
      windowMs: 15 * minute,
    },
  },
  passwordRecoveryRequest: {
    account: {
      limit: 5,
      windowMs: hour,
    },
    ip: {
      limit: 20,
      windowMs: hour,
    },
  },
  passwordResetAttempt: {
    account: {
      limit: 10,
      windowMs: 15 * minute,
    },
    ip: {
      limit: 40,
      windowMs: 15 * minute,
    },
  },
  signup: {`,
          );

          write(
            'src/server/auth/auth-security-events.ts',
            `export type AuthSecurityEventName =
  | 'auth.email_verification.already_verified'
  | 'auth.email_verification.delivery_failed'
  | 'auth.email_verification.expired'
  | 'auth.email_verification.invalid'
  | 'auth.email_verification.link_opened'
  | 'auth.email_verification.rate_limited'
  | 'auth.email_verification.sent'
  | 'auth.email_verification.unexpected_error'
  | 'auth.email_verification.verified'
  | 'auth.login.rejected'
  | 'auth.login.rate_limited'
  | 'auth.login.succeeded'
  | 'auth.password.rehash_failed'
  | 'auth.password.rehash_skipped'
  | 'auth.password.rehash_succeeded'
  | 'auth.password_recovery.changed_notification_failed'
  | 'auth.password_recovery.delivery_failed'
  | 'auth.password_recovery.expired'
  | 'auth.password_recovery.invalid'
  | 'auth.password_recovery.link_opened'
  | 'auth.password_recovery.rate_limited'
  | 'auth.password_recovery.requested'
  | 'auth.password_recovery.reset_completed'
  | 'auth.password_recovery.sent'
  | 'auth.password_recovery.unexpected_error'
  | 'auth.rate_limit.error'
  | 'auth.signup.created'
  | 'auth.signup.duplicate'
  | 'auth.signup.password_check_unavailable'
  | 'auth.signup.password_compromised'
  | 'auth.signup.password_hashing_unavailable'
  | 'auth.signup.rate_limited'
  | 'auth.signup.sign_in_failed'
  | 'auth.signup.unexpected_error';

type AuthSecurityEventMetadata = Record<
  string,
  boolean | number | string | null | undefined
>;

const warningEvents = new Set<AuthSecurityEventName>([
  'auth.email_verification.delivery_failed',
  'auth.email_verification.expired',
  'auth.email_verification.invalid',
  'auth.email_verification.rate_limited',
  'auth.email_verification.unexpected_error',
  'auth.login.rejected',
  'auth.login.rate_limited',
  'auth.password.rehash_failed',
  'auth.password.rehash_skipped',
  'auth.password_recovery.changed_notification_failed',
  'auth.password_recovery.delivery_failed',
  'auth.password_recovery.expired',
  'auth.password_recovery.invalid',
  'auth.password_recovery.rate_limited',
  'auth.password_recovery.unexpected_error',
  'auth.rate_limit.error',
  'auth.signup.duplicate',
  'auth.signup.password_check_unavailable',
  'auth.signup.password_compromised',
  'auth.signup.password_hashing_unavailable',
  'auth.signup.rate_limited',
  'auth.signup.sign_in_failed',
  'auth.signup.unexpected_error',
]);

export function recordAuthSecurityEvent(
  event: AuthSecurityEventName,
  metadata: AuthSecurityEventMetadata = {},
) {
  const entry = JSON.stringify({
    event,
    occurredAt: new Date().toISOString(),
    ...metadata,
  });

  if (warningEvents.has(event)) {
    console.warn('[auth-security]', entry);
    return;
  }

  // Security success events remain informational rather than warning-level logs.
  // eslint-disable-next-line no-console
  console.info('[auth-security]', entry);
}
`,
          );

          write(
            'src/server/auth/password-recovery/password-recovery.constants.ts',
            `export const PASSWORD_RECOVERY_TOKEN_BYTES = 32;
export const PASSWORD_RECOVERY_TOKEN_MAX_LENGTH = 128;
export const PASSWORD_RECOVERY_TOKEN_TTL_MS = 30 * 60_000;
export const PASSWORD_RECOVERY_CONFIRMATION_COOKIE =
  'vulcan_password_recovery_confirmation';
export const PASSWORD_RECOVERY_CONFIRMATION_COOKIE_TTL_SECONDS = 10 * 60;
export const PASSWORD_RECOVERY_CONFIRMATION_COOKIE_PATH =
  '/api/auth/password-recovery';
`,
          );

          write(
            'src/server/auth/password-recovery/password-recovery-token.ts',
            `import { createHash, randomBytes } from 'node:crypto';
import {
  PASSWORD_RECOVERY_TOKEN_BYTES,
  PASSWORD_RECOVERY_TOKEN_MAX_LENGTH,
} from './password-recovery.constants';

export function createPasswordRecoveryToken() {
  const token = randomBytes(PASSWORD_RECOVERY_TOKEN_BYTES).toString('base64url');

  return {
    token,
    tokenHash: hashPasswordRecoveryToken(token) as string,
  };
}

export function hashPasswordRecoveryToken(token: string) {
  if (
    typeof token !== 'string' ||
    token.length === 0 ||
    token.length > PASSWORD_RECOVERY_TOKEN_MAX_LENGTH ||
    !/^[A-Za-z0-9_-]+$/.test(token)
  ) {
    return null;
  }

  return createHash('sha256').update(token, 'utf8').digest('hex');
}
`,
          );

          write(
            'src/server/auth/password-recovery/password-recovery-token.test.ts',
            `import { describe, expect, it } from 'vitest';
import {
  createPasswordRecoveryToken,
  hashPasswordRecoveryToken,
} from './password-recovery-token';

describe('password recovery tokens', () => {
  it('creates an opaque Base64URL token and a SHA-256 fingerprint', () => {
    const result = createPasswordRecoveryToken();

    expect(result.token).toMatch(/^[A-Za-z0-9_-]+$/);
    expect(result.token).toHaveLength(43);
    expect(result.tokenHash).toHaveLength(64);
    expect(result.tokenHash).not.toBe(result.token);
  });

  it('rejects malformed and oversized token values', () => {
    expect(hashPasswordRecoveryToken('')).toBeNull();
    expect(hashPasswordRecoveryToken('not valid')).toBeNull();
    expect(hashPasswordRecoveryToken('a'.repeat(129))).toBeNull();
  });
});
`,
          );

          write(
            'src/server/auth/password-recovery/password-recovery.service.ts',
            `import { randomUUID } from 'node:crypto';
import { prisma } from '@/server/db/prisma';
import { PASSWORD_RECOVERY_TOKEN_TTL_MS } from './password-recovery.constants';
import {
  createPasswordRecoveryToken,
  hashPasswordRecoveryToken,
} from './password-recovery-token';

export type PasswordRecoveryTokenStatus = 'confirm' | 'expired' | 'invalid';

export type InspectPasswordRecoveryResult = {
  expiresAt: Date | null;
  status: PasswordRecoveryTokenStatus;
  userId: string | null;
};

export type ApplyPasswordRecoveryResult =
  | {
      email: string;
      locale: 'en' | 'fr';
      status: 'reset';
      userId: string;
    }
  | {
      email: null;
      locale: null;
      status: 'expired' | 'invalid';
      userId: string | null;
    };

export async function createPasswordRecoveryChallenge({
  now = new Date(),
  userId,
}: {
  now?: Date;
  userId: string;
}) {
  const { token, tokenHash } = createPasswordRecoveryToken();
  const expiresAt = new Date(now.getTime() + PASSWORD_RECOVERY_TOKEN_TTL_MS);
  const id = randomUUID();

  const challenge = await prisma.passwordResetToken.upsert({
    where: {
      userId,
    },
    create: {
      createdAt: now,
      expiresAt,
      id,
      tokenHash,
      userId,
    },
    update: {
      createdAt: now,
      expiresAt,
      id,
      tokenHash,
    },
    select: {
      id: true,
    },
  });

  return {
    expiresAt,
    id: challenge.id,
    token,
    userId,
  };
}

export async function revokePasswordRecoveryChallenge({
  id,
  userId,
}: {
  id: string;
  userId: string;
}) {
  await prisma.passwordResetToken.deleteMany({
    where: {
      id,
      userId,
    },
  });
}

export async function inspectPasswordRecoveryToken({
  now = new Date(),
  token,
}: {
  now?: Date;
  token: string;
}): Promise<InspectPasswordRecoveryResult> {
  const tokenHash = hashPasswordRecoveryToken(token);

  if (!tokenHash) {
    return {
      expiresAt: null,
      status: 'invalid',
      userId: null,
    };
  }

  const challenge = await prisma.passwordResetToken.findUnique({
    where: {
      tokenHash,
    },
    select: {
      expiresAt: true,
      userId: true,
    },
  });

  if (!challenge) {
    return {
      expiresAt: null,
      status: 'invalid',
      userId: null,
    };
  }

  if (challenge.expiresAt <= now) {
    return {
      expiresAt: challenge.expiresAt,
      status: 'expired',
      userId: challenge.userId,
    };
  }

  return {
    expiresAt: challenge.expiresAt,
    status: 'confirm',
    userId: challenge.userId,
  };
}

export async function applyPasswordRecovery({
  now = new Date(),
  passwordHash,
  token,
}: {
  now?: Date;
  passwordHash: string;
  token: string;
}): Promise<ApplyPasswordRecoveryResult> {
  const tokenHash = hashPasswordRecoveryToken(token);

  if (!tokenHash) {
    return {
      email: null,
      locale: null,
      status: 'invalid',
      userId: null,
    };
  }

  return prisma.$transaction(async (tx) => {
    const challenge = await tx.passwordResetToken.findUnique({
      where: {
        tokenHash,
      },
      select: {
        expiresAt: true,
        userId: true,
      },
    });

    if (!challenge) {
      return {
        email: null,
        locale: null,
        status: 'invalid' as const,
        userId: null,
      };
    }

    if (challenge.expiresAt <= now) {
      await tx.passwordResetToken.deleteMany({
        where: {
          tokenHash,
        },
      });

      return {
        email: null,
        locale: null,
        status: 'expired' as const,
        userId: challenge.userId,
      };
    }

    const consumed = await tx.passwordResetToken.deleteMany({
      where: {
        tokenHash,
      },
    });

    if (consumed.count !== 1) {
      return {
        email: null,
        locale: null,
        status: 'invalid' as const,
        userId: null,
      };
    }

    const user = await tx.user.update({
      where: {
        id: challenge.userId,
      },
      data: {
        authVersion: {
          increment: 1,
        },
        passwordHash,
      },
      select: {
        email: true,
        id: true,
        preferences: {
          select: {
            locale: true,
          },
        },
      },
    });

    await tx.passwordResetToken.deleteMany({
      where: {
        userId: challenge.userId,
      },
    });

    return {
      email: user.email,
      locale: user.preferences?.locale ?? 'en',
      status: 'reset' as const,
      userId: user.id,
    };
  });
}
`,
          );

          write(
            'src/server/auth/session-version.ts',
            `import { prisma } from '@/server/db/prisma';

export async function isAuthSessionVersionCurrent({
  authVersion,
  userId,
}: {
  authVersion: number;
  userId: string;
}) {
  try {
    const user = await prisma.user.findUnique({
      where: {
        id: userId,
      },
      select: {
        authVersion: true,
      },
    });

    return Boolean(user && user.authVersion === authVersion);
  } catch {
    return false;
  }
}
`,
          );

          write(
            'src/auth.ts',
            `import NextAuth from 'next-auth';
import Credentials from 'next-auth/providers/credentials';
import { authorizeCredentials } from '@/server/auth/credentials-authorizer';
import { isAuthSessionVersionCurrent } from '@/server/auth/session-version';

const nextAuth = NextAuth({
  session: {
    strategy: 'jwt',
  },
  providers: [
    Credentials({
      credentials: {
        email: {
          label: 'Email',
          type: 'email',
        },
        password: {
          label: 'Password',
          type: 'password',
        },
      },
      authorize: authorizeCredentials,
    }),
  ],
  callbacks: {
    async jwt({ token, user }) {
      if (user) {
        token.authVersion = user.authVersion;
        token.id = user.id;
        token.invalidated = false;
        token.locale = user.locale;
        return token;
      }

      if (
        typeof token.authVersion !== 'number' ||
        typeof token.id !== 'string'
      ) {
        token.invalidated = true;
        return token;
      }

      token.invalidated = !(await isAuthSessionVersionCurrent({
        authVersion: token.authVersion,
        userId: token.id,
      }));

      return token;
    },
    session({ session, token }) {
      session.user.id = token.invalidated ? '' : (token.id ?? '');
      session.user.locale = token.locale ?? 'en';

      return session;
    },
  },
});

export const { auth, handlers, signIn, signOut } = nextAuth;

/**
 * Explicit alias used by the verification journey to document that pending
 * accounts are valid authenticated sessions. Email verification is a product
 * trust signal and a prerequisite for selected sensitive features, not a
 * global authorization boundary for the workspace.
 */
export const authForEmailVerification = auth;
`,
          );

          write(
            'src/types/next-auth.d.ts',
            `import type { DefaultSession } from 'next-auth';
import type { AppLocale } from '@/domain/i18n';

declare module 'next-auth' {
  interface User {
    authVersion: number;
    id: string;
    locale: AppLocale;
  }

  interface Session {
    user: {
      id: string;
      locale: AppLocale;
    } & DefaultSession['user'];
  }
}

declare module 'next-auth/jwt' {
  interface JWT {
    authVersion?: number;
    id?: string;
    invalidated?: boolean;
    locale?: AppLocale;
  }
}
`,
          );

          replaceExact(
            'src/server/auth/credentials-authorizer.ts',
            `type AuthenticatedUser = {
  email: string;`,
            `type AuthenticatedUser = {
  authVersion: number;
  email: string;`,
          );

          replaceExact(
            'src/server/auth/credentials-authorizer.ts',
            `    select: {
      id: true,`,
            `    select: {
      authVersion: true,
      id: true,`,
          );

          replaceExact(
            'src/server/auth/credentials-authorizer.ts',
            `  return {
    id: user.id,`,
            `  return {
    authVersion: user.authVersion,
    id: user.id,`,
          );

          write(
            'src/server/auth/password-recovery/password-recovery.integration.test.ts',
            `// @vitest-environment node

import type { PrismaClient } from '@/generated/prisma/client';
import type {
  applyPasswordRecovery as ApplyPasswordRecovery,
  createPasswordRecoveryChallenge as CreatePasswordRecoveryChallenge,
  inspectPasswordRecoveryToken as InspectPasswordRecoveryToken,
} from './password-recovery.service';
import type { isAuthSessionVersionCurrent as IsAuthSessionVersionCurrent } from '../session-version';
import { afterAll, beforeAll, beforeEach, describe, expect, it } from 'vitest';

const runDatabaseTests =
  process.env.RUN_AUTH_DATABASE_TESTS === 'true' &&
  Boolean(process.env.DATABASE_URL);

let prisma: PrismaClient;
let applyPasswordRecovery: typeof ApplyPasswordRecovery;
let createPasswordRecoveryChallenge: typeof CreatePasswordRecoveryChallenge;
let inspectPasswordRecoveryToken: typeof InspectPasswordRecoveryToken;
let isAuthSessionVersionCurrent: typeof IsAuthSessionVersionCurrent;

const testEmailSuffix = '@password-recovery.integration.test';

async function createTestUser(localPart: string) {
  return prisma.user.create({
    data: {
      email: `${localPart}${testEmailSuffix}`,
      name: 'Password recovery test user',
      passwordHash: 'old-integration-test-hash',
      preferences: {
        create: {
          locale: 'fr',
        },
      },
    },
    select: {
      authVersion: true,
      id: true,
    },
  });
}

describe.skipIf(!runDatabaseTests)(
  'password recovery PostgreSQL integration',
  () => {
    beforeAll(async () => {
      const prismaModule = await import('@/server/db/prisma');
      const serviceModule = await import('./password-recovery.service');
      const sessionVersionModule = await import('../session-version');

      prisma = prismaModule.prisma;
      applyPasswordRecovery = serviceModule.applyPasswordRecovery;
      createPasswordRecoveryChallenge =
        serviceModule.createPasswordRecoveryChallenge;
      inspectPasswordRecoveryToken =
        serviceModule.inspectPasswordRecoveryToken;
      isAuthSessionVersionCurrent =
        sessionVersionModule.isAuthSessionVersionCurrent;
    });

    beforeEach(async () => {
      await prisma.user.deleteMany({
        where: {
          email: {
            endsWith: testEmailSuffix,
          },
        },
      });
    });

    afterAll(async () => {
      await prisma.user.deleteMany({
        where: {
          email: {
            endsWith: testEmailSuffix,
          },
        },
      });
      await prisma.$disconnect();
    });

    it('stores only the token hash and inspects without consuming it', async () => {
      const user = await createTestUser('inspect');
      const challenge = await createPasswordRecoveryChallenge({
        userId: user.id,
      });
      const persisted = await prisma.passwordResetToken.findFirstOrThrow({
        where: {
          userId: user.id,
        },
      });

      expect(persisted.tokenHash).not.toBe(challenge.token);
      expect(persisted.tokenHash).toHaveLength(64);
      await expect(
        inspectPasswordRecoveryToken({ token: challenge.token }),
      ).resolves.toEqual({
        expiresAt: challenge.expiresAt,
        status: 'confirm',
        userId: user.id,
      });
      await expect(
        prisma.passwordResetToken.count({ where: { userId: user.id } }),
      ).resolves.toBe(1);
    });

    it('atomically changes the password, increments auth version and consumes the challenge', async () => {
      const user = await createTestUser('reset');
      const challenge = await createPasswordRecoveryChallenge({
        userId: user.id,
      });

      await expect(
        isAuthSessionVersionCurrent({
          authVersion: user.authVersion,
          userId: user.id,
        }),
      ).resolves.toBe(true);
      await expect(
        applyPasswordRecovery({
          passwordHash: 'new-integration-test-hash',
          token: challenge.token,
        }),
      ).resolves.toEqual({
        email: `reset${testEmailSuffix}`,
        locale: 'fr',
        status: 'reset',
        userId: user.id,
      });

      const updated = await prisma.user.findUniqueOrThrow({
        where: { id: user.id },
        select: { authVersion: true, passwordHash: true },
      });

      expect(updated).toEqual({
        authVersion: user.authVersion + 1,
        passwordHash: 'new-integration-test-hash',
      });
      await expect(
        isAuthSessionVersionCurrent({
          authVersion: user.authVersion,
          userId: user.id,
        }),
      ).resolves.toBe(false);
      await expect(
        isAuthSessionVersionCurrent({
          authVersion: updated.authVersion,
          userId: user.id,
        }),
      ).resolves.toBe(true);
      await expect(
        applyPasswordRecovery({
          passwordHash: 'another-hash',
          token: challenge.token,
        }),
      ).resolves.toEqual({
        email: null,
        locale: null,
        status: 'invalid',
        userId: null,
      });
    });

    it('rejects and removes an expired challenge', async () => {
      const user = await createTestUser('expired');
      const now = new Date();
      const challenge = await createPasswordRecoveryChallenge({
        now: new Date(now.getTime() - 31 * 60_000),
        userId: user.id,
      });

      await expect(
        applyPasswordRecovery({
          now,
          passwordHash: 'new-hash',
          token: challenge.token,
        }),
      ).resolves.toEqual({
        email: null,
        locale: null,
        status: 'expired',
