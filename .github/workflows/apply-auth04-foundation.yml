name: Apply AUTH-04 foundation

on:
  push:
    branches:
      - feature/ds-170-auth-04-password-recovery

permissions:
  contents: write

concurrency:
  group: apply-auth04-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vulcan
          POSTGRES_PASSWORD: vulcan_dev_password
          POSTGRES_DB: vulcan_forge_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulcan -d vulcan_forge_ui"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public
      RUN_AUTH_DATABASE_TESTS: 'true'
      AUTH_RATE_LIMIT_SECRET: integration-rate-limit-secret
      AUTH_TRUST_PROXY_HEADERS: 'false'
      AUTH_RATE_LIMIT_FAIL_OPEN: 'false'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-04-password-recovery

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair generated test literals
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-auth04-foundation.cjs')
          content = path.read_text()
          replacements = {
              'email: `${localPart}${testEmailSuffix}`,': 'email: localPart + testEmailSuffix,',
              'email: `reset${testEmailSuffix}`,': "email: 'reset' + testEmailSuffix,",
              'passwordHash: `hash-${challenge.id}`,': "passwordHash: 'hash-' + challenge.id,",
          }

          for before, after in replacements.items():
              if before not in content:
                  raise SystemExit(f'Expected helper text missing: {before}')
              content = content.replace(before, after)

          path.write_text(content)
          PY

      - name: Apply foundation
        run: node scripts/apply-auth04-foundation.cjs

      - name: Format Prisma and source files
        run: |
          npx prisma format
          npx prettier \
            package.json \
            src/auth.ts \
            src/types/next-auth.d.ts \
            src/server/auth/auth-rate-limit.ts \
            src/server/auth/auth-security-events.ts \
            src/server/auth/credentials-authorizer.ts \
            src/server/auth/session-version.ts \
            src/server/auth/password-recovery/password-recovery.constants.ts \
            src/server/auth/password-recovery/password-recovery-token.ts \
            src/server/auth/password-recovery/password-recovery-token.test.ts \
            src/server/auth/password-recovery/password-recovery.service.ts \
            src/server/auth/password-recovery/password-recovery.integration.test.ts \
            --write

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Validate foundation
        run: |
          npm run test:auth-integration
          npm run lint
          npm run typecheck
          npm run format:check
          npx vitest run src/server/auth/password-recovery/password-recovery-token.test.ts

      - name: Remove temporary helpers
        run: |
          rm .github/workflows/apply-auth04-foundation.yml
          rm scripts/apply-auth04-foundation.cjs

      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): add password recovery foundation"
          git push origin HEAD:feature/ds-170-auth-04-password-recovery
