name: DS-170-07 QA corrections

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply wizard dialog and 404 corrections') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Apply corrections
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              content = file.read_text()
              if old not in content:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              file.write_text(content.replace(old, new, count))

          dialog = Path('src/components/ui/Dialog.tsx')
          dialog.write_text("""'use client';

import { useEffect, useRef, type MouseEvent, type ReactNode } from 'react';

export type DialogSize = 'md' | 'lg';

export type DialogProps = {
  open: boolean;
  onClose: () => void;
  ariaLabel: string;
  children: ReactNode;
  size?: DialogSize;
};

const sizeClassNames: Record<DialogSize, string> = {
  md: 'max-w-xl',
  lg: 'max-w-3xl',
};

export function Dialog({
  open,
  onClose,
  ariaLabel,
  children,
  size = 'md',
}: DialogProps) {
  const dialogRef = useRef<HTMLDialogElement>(null);
  const returnFocusRef = useRef<HTMLElement | null>(null);

  useEffect(() => {
    const dialogElement = dialogRef.current;

    if (!dialogElement) {
      return;
    }

    if (open) {
      if (dialogElement.open) {
        return;
      }

      returnFocusRef.current =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;
      dialogElement.showModal();

      requestAnimationFrame(() => {
        if (!dialogElement.open) {
          return;
        }

        dialogElement
          .querySelector<HTMLElement>(
            '[autofocus], input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"])',
          )
          ?.focus();
      });

      return;
    }

    if (dialogElement.open) {
      dialogElement.close();
    }

    returnFocusRef.current?.focus();
  }, [open]);

  function handleBackdropClick(event: MouseEvent<HTMLDialogElement>) {
    if (event.target === event.currentTarget) {
      event.currentTarget.close();
    }
  }

  return (
    <dialog
      ref={dialogRef}
      aria-label={ariaLabel}
      onClose={onClose}
      onClick={handleBackdropClick}
      className={[
        'border-border-default bg-background-app text-content-primary backdrop:bg-overlay-scrim m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] overflow-y-auto rounded-xl border p-0 shadow-2xl',
        sizeClassNames[size],
      ].join(' ')}
    >
      {children}
    </dialog>
  );
}
""")

          replace(
              'src/components/ui/index.ts',
              "export { ErrorState } from './ErrorState';\n",
              "export { ErrorState } from './ErrorState';\nexport { Dialog } from './Dialog';\nexport type { DialogProps, DialogSize } from './Dialog';\n",
          )

          replace(
              'src/app/[locale]/app/projects/new/page.tsx',
              '<section className="mx-auto max-w-5xl">',
              '<section className="mx-auto min-h-full max-w-5xl px-4 py-8 sm:px-6 lg:px-8 lg:py-12">',
          )
          replace(
              'src/features/design-systems/CreateDesignSystemWizard.tsx',
              '<form className="mt-8" onSubmit={handleSubmit}>',
              '<form className="mt-8 pb-8 sm:pb-10" onSubmit={handleSubmit}>',
          )

          for form_path in [
              'src/features/tokens/CreateColorTokenForm.tsx',
              'src/features/tokens/CreateDesignTokenForm.tsx',
              'src/features/tokens/CreateTypographyTokenForm.tsx',
          ]:
              replace(
                  form_path,
                  'className="border-border-subtle bg-surface-primary mt-6 rounded-lg border p-5"',
                  'className="bg-background-app p-5 sm:p-6"',
              )

          shell_path = Path('src/features/tokens/editor/TokensEditorShell.tsx')
          shell = shell_path.read_text()
          shell = shell.replace(
              "import { ProjectWorkspaceHeader, WorkspaceState } from '@/components/ui';",
              "import { Dialog, ProjectWorkspaceHeader, WorkspaceState } from '@/components/ui';",
              1,
          )

          helper_marker = "export type TokenSetEditorViewModel = TokenSetListPanelViewModel;\n"
          helper = """

function getCreateTokenDialogLabel(
  type: TokenSetType | null,
  labels: TokensEditorShellLabels,
) {
  switch (type) {
    case 'color':
      return labels.createColorToken.title;
    case 'spacing':
      return labels.createDesignToken.spacing.title;
    case 'radius':
      return labels.createDesignToken.radius.title;
    case 'motion':
      return labels.createDesignToken.motion.title;
    case 'typography':
      return labels.createTypographyToken.title;
    default:
      return labels.toolbar.newToken;
  }
}
"""
          if helper_marker not in shell:
              raise SystemExit('TokensEditorShell helper marker not found')
          shell = shell.replace(helper_marker, helper_marker + helper, 1)

          forms_start = shell.index("          {createTokenFormType === 'color' ? (")
          list_start = shell.index(
              '          <div className="min-h-0 xl:flex-1 xl:overflow-hidden">',
              forms_start,
          )
          shell = shell[:forms_start] + shell[list_start:]

          closing_marker = """      </aside>
    </div>
  );
}
"""
          dialog_block = """      </aside>

      <Dialog
        open={createTokenFormType !== null}
        onClose={handleCreateTokenCancel}
        ariaLabel={getCreateTokenDialogLabel(createTokenFormType, labels)}
        size={createTokenFormType === 'typography' ? 'lg' : 'md'}
      >
        {createTokenFormType === 'color' ? (
          <CreateColorTokenForm
            locale={locale}
            projectSlug={projectSlug}
            primitiveColorAliasOptions={primitiveColorAliasOptions}
            labels={labels.createColorToken}
            onCancel={handleCreateTokenCancel}
            onCreated={(tokenPath) =>
              handleTokenCreated({
                tokenSetType: 'color',
                tokenPath,
              })
            }
          />
        ) : null}

        {createTokenFormType === 'spacing' ? (
          <CreateDesignTokenForm
            locale={locale}
            projectSlug={projectSlug}
            type="spacing"
            labels={labels.createDesignToken.spacing}
            onCancel={handleCreateTokenCancel}
            onCreated={(tokenPath) =>
              handleTokenCreated({
                tokenSetType: 'spacing',
                tokenPath,
              })
            }
          />
        ) : null}

        {createTokenFormType === 'radius' ? (
          <CreateDesignTokenForm
            locale={locale}
            projectSlug={projectSlug}
            type="radius"
            labels={labels.createDesignToken.radius}
            onCancel={handleCreateTokenCancel}
            onCreated={(tokenPath) =>
              handleTokenCreated({
                tokenSetType: 'radius',
                tokenPath,
              })
            }
          />
        ) : null}

        {createTokenFormType === 'motion' ? (
          <CreateDesignTokenForm
            locale={locale}
            projectSlug={projectSlug}
            type="motion"
            labels={labels.createDesignToken.motion}
            onCancel={handleCreateTokenCancel}
            onCreated={(tokenPath) =>
              handleTokenCreated({
                tokenSetType: 'motion',
                tokenPath,
              })
            }
          />
        ) : null}

        {createTokenFormType === 'typography' ? (
          <CreateTypographyTokenForm
            locale={locale}
            projectSlug={projectSlug}
            labels={labels.createTypographyToken}
            onCancel={handleCreateTokenCancel}
            onCreated={(tokenPath) =>
              handleTokenCreated({
                tokenSetType: 'typography',
                tokenPath,
              })
            }
          />
        ) : null}
      </Dialog>
    </div>
  );
}
"""
          if closing_marker not in shell:
              raise SystemExit('TokensEditorShell closing marker not found')
          shell_path.write_text(shell.replace(closing_marker, dialog_block, 1))

          replace(
              'src/features/tokens/TokenTable.tsx',
              'className="border-border-subtle bg-background-subtle rounded-2xl border p-4"',
              'className="border-border-subtle bg-background-subtle rounded-lg border p-4"',
          )

          public_catch_all = Path('src/app/[locale]/(public)/[...missing]/page.tsx')
          public_catch_all.parent.mkdir(parents=True, exist_ok=True)
          public_catch_all.write_text("""import { notFound } from 'next/navigation';

export default function MissingPublicRoute() {
  notFound();
}
""")

          app_catch_all = Path('src/app/[locale]/app/[...missing]/page.tsx')
          app_catch_all.parent.mkdir(parents=True, exist_ok=True)
          app_catch_all.write_text("""import { notFound } from 'next/navigation';

export default function MissingAppRoute() {
  notFound();
}
""")

          quality = Path('.github/workflows/quality.yml')
          quality.write_text("""name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run UI audit
        run: npm run audit:ui

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
""")
          PY
          npm run format
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(ds-170-07): apply wizard dialog and 404 corrections"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
