name: DS-181R-03C refine

on:
  push:
    branches:
      - agent/ds-181r-03c-button-property-inspector
    paths:
      - scripts/ds-181r-03c-refine.py
      - .github/workflows/ds-181r-03c-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03c-button-property-inspector
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply UX refinement
        run: python scripts/ds-181r-03c-refine.py
      - name: Format touched files
        run: |
          npx prettier --write \
            src/features/components/ComponentDetailsPanel.tsx \
            src/features/components/ComponentContractEditorBoundary.tsx \
            src/features/components/ComponentContractEditor.tsx \
            src/features/components/ComponentContractEditorSections.tsx \
            src/features/components/ComponentAnatomyEditor.tsx \
            src/features/components/ButtonVisualCustomizationEditor.tsx \
            src/features/components/ButtonVisualCustomizationEditor.test.tsx \
            src/messages/component-v2-customization-messages.ts \
            docs/product/ds-181r-03c-button-property-inspector.md
      - name: Remove temporary apply files
        run: rm scripts/ds-181r-03c-refine.py .github/workflows/ds-181r-03c-refine.yml
      - name: Commit refinement
        run: |
          git config user.name "William Louis-Louisy"
          git config user.email "87181045+William-Louis-Louisy@users.noreply.github.com"
          git add -A
          git commit -m "refactor: refine Button property inspector hierarchy"
          git push origin HEAD:agent/ds-181r-03c-button-property-inspector
