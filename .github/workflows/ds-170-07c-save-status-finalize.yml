name: DS-170-07C Save Status Finalize

on:
  push:
    branches:
      - feature/ds-170-07c-project-deletion

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07c-project-deletion
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align brand save status lifecycle
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/brand/BrandProfileEditor.tsx')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "import { useProjectSaveStatus } from '@/components/layout/ProjectTopbarBreadcrumb';",
              "import { useActionBackedProjectSaveStatus } from '@/features/save-context/useActionBackedProjectSaveStatus';\nimport { usePreserveSaveContext } from '@/features/save-context/usePreserveSaveContext';",
              1,
          )
          source = source.replace(
              "\ntype ProfileSaveStatus = 'saved' | 'unsaved' | 'saving' | 'error';\n",
              "\n",
              1,
          )

          status_pattern = re.compile(
              r"  const savedProductName = state\.savedProductName \?\? project\.name;\n"
              r".*?"
              r"  useProjectSaveStatus\(`brand-profile:\$\{project\.slug\}`, saveStatus\);\n",
              re.DOTALL,
          )
          status_replacement = '''  const normalizedProductName = productName.trim();
          const parsedProfile = brandProfileSchema.safeParse(profile);
          const hasValidProductName =
            normalizedProductName.length >= 2 && normalizedProductName.length <= 80;
          const isValid = parsedProfile.success && hasValidProductName;
          const payload = isValid
            ? JSON.stringify({
                productName: normalizedProductName,
                profile: parsedProfile.data,
              })
            : '';
          const sourceId = `brand-profile:${project.slug}`;
          const currentFingerprint = JSON.stringify({
            productName: normalizedProductName,
            profile,
          });
          const successfulFingerprint =
            state.status === 'success' &&
            state.savedProductName !== null &&
            state.savedProfile !== null
              ? JSON.stringify({
                  productName: state.savedProductName,
                  profile: state.savedProfile,
                })
              : null;
          const {
            hasCurrentActionError,
            hasUnsavedChanges,
            markCurrentDraftSubmitted,
            status: saveStatus,
          } = useActionBackedProjectSaveStatus({
            sourceId,
            currentFingerprint,
            initialSavedFingerprint: JSON.stringify({
              productName: project.name.trim(),
              profile: initialProfile,
            }),
            actionStatus: state.status,
            successfulFingerprint,
            isPending,
            hasValidationError: !isValid,
          });
          const preserveSaveContext = usePreserveSaveContext(sourceId);
          '''
          source, status_count = status_pattern.subn(status_replacement, source, count=1)
          if status_count != 1:
              raise SystemExit('Brand save status block not found')

          feedback_pattern = re.compile(
              r"  const feedback = state\.formError\n"
              r".*?"
              r"      : t\('feedback\.savedState'\);\n",
              re.DOTALL,
          )
          feedback_replacement = '''  function handleSubmitCapture() {
            markCurrentDraftSubmitted();
            preserveSaveContext();
          }

          const feedback =
            hasCurrentActionError && state.formError
              ? t(`errors.${state.formError}`)
              : !isValid
                ? t('feedback.invalid')
                : saveStatus === 'saving'
                  ? t('actions.saving')
                  : state.status === 'success' && !hasUnsavedChanges
                    ? t('feedback.saved')
                    : hasUnsavedChanges
                      ? t('feedback.unsaved')
                      : t('feedback.savedState');
          '''
          source, feedback_count = feedback_pattern.subn(
              feedback_replacement,
              source,
              count=1,
          )
          if feedback_count != 1:
              raise SystemExit('Brand feedback block not found')

          source = source.replace(
              '''    <form
                action={formAction}
                className="flex min-h-0 flex-col xl:absolute xl:inset-0 xl:h-auto xl:overflow-hidden"
              >''',
              '''    <form
                action={formAction}
                onSubmitCapture={handleSubmitCapture}
                className="flex min-h-0 flex-col xl:absolute xl:inset-0 xl:h-auto xl:overflow-hidden"
              >''',
              1,
          )

          feedback_surface_pattern = re.compile(
              r"        <p\n"
              r"          role=\{state\.formError \? 'alert' : 'status'\}\n"
              r"          className=\{\[\n"
              r"            'text-xs font-semibold',\n"
              r"            state\.formError\n"
              r".*?"
              r"          \]\.join\(' '\)\}\n"
              r"        >",
              re.DOTALL,
          )
          feedback_surface_replacement = '''        <p
                    role={hasCurrentActionError ? 'alert' : 'status'}
                    className={[
                      'text-xs font-semibold',
                      hasCurrentActionError || !isValid
                        ? 'text-action-danger'
                        : saveStatus === 'saving'
                          ? 'text-content-secondary'
                          : state.status === 'success' && !hasUnsavedChanges
                            ? 'text-action-success'
                            : hasUnsavedChanges
                              ? 'text-action-warning'
                              : 'text-content-tertiary',
                    ].join(' ')}
                  >'''
          source, surface_count = feedback_surface_pattern.subn(
              feedback_surface_replacement,
              source,
              count=1,
          )
          if surface_count != 1:
              raise SystemExit('Brand feedback surface not found')

          path.write_text(source, encoding='utf-8')
          PY
      - name: Format save status files
        run: >-
          npx prettier
          src/components/layout/ProjectTopbarBreadcrumb.tsx
          src/features/brand/BrandProfileEditor.tsx
          src/features/components/ComponentContractEditor.tsx
          src/features/save-context/useActionBackedProjectSaveStatus.ts
          src/features/save-context/useActionBackedProjectSaveStatus.test.ts
          src/features/tokens/DesignTokenValueEditor.tsx
          src/features/tokens/PrimitiveColorTokenEditor.tsx
          src/features/tokens/SemanticColorTokenAliasEditor.tsx
          src/features/tokens/TokenDescriptionEditor.tsx
          src/features/tokens/TokenRenameForm.tsx
          src/features/tokens/TypographyTokenValueEditor.tsx
          --write
      - name: Remove temporary workflow
        run: rm .github/workflows/ds-170-07c-save-status-finalize.yml
      - name: Commit finalized audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ds-170-07c): harden project save status lifecycle"
          git push origin HEAD:feature/ds-170-07c-project-deletion
