name: Format AUTH-03 follow-up

on:
  push:
    branches:
      - feature/ds-170-auth-03-email-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-03-email-verification

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix lint and formatting
        run: |
          npx eslint "src/app/api/auth/verify-email/route.ts" --fix
          npx prettier --write \
            "src/app/api/auth/verify-email/route.ts" \
            "src/features/auth/email-verification/EmailVerificationBanner.test.tsx" \
            "src/server/auth/email-verification/email-verification.integration.test.ts"

      - name: Remove temporary workflow
        run: rm .github/workflows/format-auth03-followup.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(auth): format email verification follow-up"
          git push origin HEAD:feature/ds-170-auth-03-email-verification
