name: DS-170-07 final formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.head_ref == 'feature/ds-170-07-visual-debt-audit' && !contains(github.event.pull_request.head.label, 'format final QA corrections') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ds-170-07): format final QA corrections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
