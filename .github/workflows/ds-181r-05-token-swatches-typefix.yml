name: DS-181R-05 token swatch typefix

on:
  push:
    branches:
      - agent/ds-181r-05-card-customization
    paths:
      - .github/workflows/ds-181r-05-token-swatches-typefix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-05-card-customization
          fetch-depth: 0

      - name: Fix exact optional swatch projection
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceAllExact(path, before, after, expectedCount) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== expectedCount) {
              throw new Error(`Expected ${expectedCount} matches in ${path}, found ${count}`);
            }
            fs.writeFileSync(path, source.split(before).join(after));
          }

          replaceAllExact(
            'src/features/components/ButtonVisualCustomizationEditor.tsx',
            `              swatch: token.swatch,`,
            `              ...(token.swatch ? { swatch: token.swatch } : {}),`,
            2,
          );

          replaceAllExact(
            'src/features/components/ComponentContractEditorSections.tsx',
            `                swatch: tokenOption.swatch,`,
            `                ...(tokenOption.swatch\n                  ? { swatch: tokenOption.swatch }\n                  : {}),`,
            1,
          );
          NODE

      - name: Remove helper and commit
        run: |
          git rm .github/workflows/ds-181r-05-token-swatches-typefix.yml
          git add src/features/components/ButtonVisualCustomizationEditor.tsx src/features/components/ComponentContractEditorSections.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve exact optional swatch typing"
          git push origin HEAD:agent/ds-181r-05-card-customization
