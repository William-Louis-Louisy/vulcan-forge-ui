name: DS-170-08B2 format

on:
  push:
    branches:
      - feature/ds-170-08b2-token-authoring-ergonomics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-08b2-token-authoring-ergonomics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format DS-170-08B2 files
        run: >-
          npx prettier --write
          src/components/ui/ContextualHelp.tsx
          src/features/tokens/CreateColorTokenForm.tsx
          src/features/tokens/editor/TokenSetListPanel.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/ContextualHelp.tsx src/features/tokens/CreateColorTokenForm.tsx src/features/tokens/editor/TokenSetListPanel.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: format DS-170-08B2 changes"
          git push origin HEAD:feature/ds-170-08b2-token-authoring-ergonomics
