name: DS-181R-03C collapsible header refinement

on:
  push:
    branches:
      - agent/ds-181r-03c-button-property-inspector

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-03c-button-property-inspector
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply refinement
        run: python scripts/ds-181r-03c-collapsible-header-fix.py

      - name: Format touched files
        run: >-
          npx prettier
          src/features/components/ComponentContractEditorSections.tsx
          src/features/components/ComponentAnatomyEditor.tsx
          src/features/components/ButtonVisualCustomizationEditor.tsx
          src/features/components/ComponentContractEditor.test.tsx
          src/features/components/ButtonVisualCustomizationEditor.test.tsx
          --write

      - name: Run focused tests
        run: >-
          npx vitest run
          src/features/components/ComponentContractEditor.test.tsx
          src/features/components/ButtonVisualCustomizationEditor.test.tsx

      - run: npm run db:generate

      - name: Run strict typecheck
        run: npm run typecheck

      - name: Remove temporary assets
        run: |
          git rm scripts/ds-181r-03c-collapsible-header-fix.py
          git rm .github/workflows/ds-181r-03c-collapsible-header-fix.yml

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refine collapsible section headers"
          git push origin HEAD:agent/ds-181r-03c-button-property-inspector
