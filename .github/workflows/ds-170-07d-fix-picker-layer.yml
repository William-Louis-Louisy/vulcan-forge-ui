name: Apply DS-170-07D picker layer fix

on:
  push:
    branches:
      - feature/ds-170-07d-professional-color-authoring

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07d-professional-color-authoring

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Apply picker layer fix
        run: node scripts/apply-ds-170-07d-picker-layer-fix.mjs

      - name: Commit picker layer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tokens/ColorPickerField.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: render color picker in the top layer"
          git push
