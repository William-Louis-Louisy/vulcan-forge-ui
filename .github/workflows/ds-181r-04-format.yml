name: DS-181R-04 format

on:
  push:
    branches:
      - agent/ds-181r-04-textfield-customization
    paths:
      - .github/workflows/ds-181r-04-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-04-textfield-customization
          fetch-depth: 0
      - name: Format failing R04 files
        run: >-
          npx --yes --package prettier@3.8.3 --package prettier-plugin-tailwindcss@0.8.0
          prettier --plugin=prettier-plugin-tailwindcss
          src/features/components/ComponentContractEditor.test.tsx
          src/features/components/ComponentContractEditorSections.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          src/features/components/ComponentFoundationsPreviewClient.tsx
          --write
      - name: Verify formatting
        run: >-
          npx --yes --package prettier@3.8.3 --package prettier-plugin-tailwindcss@0.8.0
          prettier --plugin=prettier-plugin-tailwindcss
          src/features/components/ComponentContractEditor.test.tsx
          src/features/components/ComponentContractEditorSections.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          src/features/components/ComponentFoundationsPreviewClient.tsx
          --check
      - name: Remove temporary workflow
        run: git rm .github/workflows/ds-181r-04-format.yml
      - name: Commit formatting and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format and clean up DS-181R-04"
          git push origin HEAD:agent/ds-181r-04-textfield-customization
