name: DS-181R-04 format

on:
  pull_request:
    branches:
      - refactor/components-v2-customization
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/ds-181r-04-textfield-customization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-04-textfield-customization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format failing R04 files
        run: >-
          npx prettier
          src/features/components/ComponentContractEditor.test.tsx
          src/features/components/ComponentContractEditorSections.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          src/features/components/ComponentFoundationsPreviewClient.tsx
          --write
      - name: Verify formatting
        run: >-
          npx prettier
          src/features/components/ComponentContractEditor.test.tsx
          src/features/components/ComponentContractEditorSections.tsx
          src/features/components/ComponentFoundationsPreviewClient.test.tsx
          src/features/components/ComponentFoundationsPreviewClient.tsx
          --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/components/ComponentContractEditor.test.tsx \
            src/features/components/ComponentContractEditorSections.tsx \
            src/features/components/ComponentFoundationsPreviewClient.test.tsx \
            src/features/components/ComponentFoundationsPreviewClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: format DS-181R-04 files"
          git push origin HEAD:agent/ds-181r-04-textfield-customization
