name: DS-170-07 visual cleanup

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'finish scoped visual cleanup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply scoped cleanup
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              if old not in content:
                  raise SystemExit(f'Missing expected block in {path}: {old[:80]!r}')
              file.write_text(content.replace(old, new))

          matrix = 'src/features/components/ComponentVisualMatrix.tsx'
          replace(
              matrix,
              "import { useState, type CSSProperties } from 'react';",
              "import { useState, type CSSProperties } from 'react';\nimport { Select } from '@/components/ui';",
          )
          replace(
              matrix,
              """        <label className=\"mb-3 flex items-center justify-end gap-2\">\n          <span className=\"text-content-tertiary text-xs font-semibold\">\n            {labels.state}\n          </span>\n          <select\n            aria-label={labels.state}\n            value={stateKey}\n            onChange={(event) => setStateKey(event.target.value)}\n            className=\"border-border-subtle bg-surface-primary focus:border-action-primary min-h-8 rounded-md border px-2.5 font-mono text-xs outline-none\"\n          >\n            <option value=\"\">{labels.baseState}</option>\n            {states.map((state) => (\n              <option key={state.key} value={state.key}>\n                {resolveMatrixLabel(locale, state.label, state.key)}\n              </option>\n            ))}\n          </select>\n        </label>""",
              """        <div className=\"mb-3 ml-auto grid max-w-xs gap-1.5\">\n          <label\n            htmlFor=\"component-preview-state\"\n            className=\"text-content-tertiary text-xs font-semibold\"\n          >\n            {labels.state}\n          </label>\n          <Select\n            id=\"component-preview-state\"\n            value={stateKey}\n            options={[\n              { value: '', label: labels.baseState },\n              ...states.map((state) => ({\n                value: state.key,\n                label: resolveMatrixLabel(locale, state.label, state.key),\n              })),\n            ]}\n            onValueChange={setStateKey}\n            placeholder={labels.baseState}\n            size=\"sm\"\n          />\n        </div>""",
          )

          settings = 'src/features/settings/SettingsForm.tsx'
          replace(settings, 'className="bg-white"', 'className="bg-[var(--vf-color-white)]"')
          replace(settings, 'className="bg-neutral-900"', 'className="bg-[var(--vf-color-stone-900)]"')
          replace(
              settings,
              "preference === 'light' ? 'bg-white' : 'bg-neutral-900'",
              "preference === 'light'\n          ? 'bg-[var(--vf-color-white)]'\n          : 'bg-[var(--vf-color-stone-900)]'",
          )
          PY
          npm run format

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ds-170-07): finish scoped visual cleanup"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
