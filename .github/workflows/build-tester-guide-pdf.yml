name: Build tester guide PDF

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/testing/vulcanforge-ui-guide-testeurs.fr.md
      - docs/testing/vulcanforge-ui-guide-pdf.css
      - scripts/docs/generate_tester_guide_pdf.py
      - .github/workflows/build-tester-guide-pdf.yml
  push:
    branches:
      - docs/tester-user-guide
    paths:
      - docs/testing/vulcanforge-ui-guide-testeurs.fr.md
      - docs/testing/vulcanforge-ui-guide-pdf.css
      - scripts/docs/generate_tester_guide_pdf.py
      - .github/workflows/build-tester-guide-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    name: Build tester guide PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check markdown==3.8.2 weasyprint==66.0

      - name: Generate styled PDF
        run: python scripts/docs/generate_tester_guide_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulcanforge-ui-guide-testeurs-pdf
          path: dist/testing-guide/VulcanForge-UI-Guide-Testeurs-v1.1.pdf
          if-no-files-found: error
          retention-days: 14
