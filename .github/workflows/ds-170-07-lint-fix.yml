name: DS-170-07 lint formatter

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'apply automated lint and formatting fixes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fixable lint and formatting changes
        run: |
          npm run lint:fix || true
          npm run format

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ds-170-07): apply automated lint and formatting fixes"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
