name: Formatting diagnostics

on:
  pull_request:
    branches:
      - main

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format workspace state
        run: npx prettier src/components/ui/WorkspaceState.tsx --write

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-workspace-state
          path: src/components/ui/WorkspaceState.tsx
