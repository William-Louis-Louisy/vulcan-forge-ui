name: DS-170-07 component editor migration

on:
  push:
    branches:
      - feature/ds-170-07-visual-debt-audit

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'migrate remaining component editor controls') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate component editor controls
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              if old not in content:
                  raise SystemExit(f'Missing expected block in {path}: {old[:80]!r}')
              file.write_text(content.replace(old, new))

          editor = 'src/features/components/ComponentContractEditorSections.tsx'
          replace(editor, "import { Button } from '@/components/ui';", "import { Button, Input, Select, Textarea } from '@/components/ui';")
          replace(
              editor,
              """    selectToken: string;\n  };""",
              """    selectToken: string;\n    tokenTypes: {\n      color: string;\n      spacing: string;\n      radius: string;\n      typography: string;\n      motion: string;\n    };\n  };""",
          )
          replace(
              editor,
              """      <label className=\"grid min-w-0 gap-1.5\">\n        <span className=\"text-content-secondary text-xs font-semibold\">\n          {labels.basics.status}\n        </span>\n        <select\n          value={draft.status}\n          onChange={(event) =>\n            setDraft({\n              ...draft,\n              status: event.target\n                .value as ComponentContractEditorDraft['status'],\n            })\n          }\n          className={fieldClassName}\n        >\n          <option value=\"draft\">{labels.statuses.draft}</option>\n          <option value=\"ready\">{labels.statuses.ready}</option>\n          <option value=\"deprecated\">{labels.statuses.deprecated}</option>\n        </select>\n      </label>""",
              """      <div className=\"grid min-w-0 gap-1.5\">\n        <label\n          htmlFor=\"component-contract-status\"\n          className=\"text-content-secondary text-xs font-semibold\"\n        >\n          {labels.basics.status}\n        </label>\n        <Select<ComponentContractEditorDraft['status']>\n          id=\"component-contract-status\"\n          value={draft.status}\n          options={[\n            { value: 'draft', label: labels.statuses.draft },\n            { value: 'ready', label: labels.statuses.ready },\n            { value: 'deprecated', label: labels.statuses.deprecated },\n          ]}\n          onValueChange={(status) => setDraft({ ...draft, status })}\n          placeholder={labels.basics.status}\n          size=\"sm\"\n        />\n      </div>""",
          )
          replace(
              editor,
              """        <label className=\"grid min-w-0 gap-1.5\">\n          <span className=\"text-content-secondary text-xs font-semibold\">\n            {labels.accessibility.severity}\n          </span>\n          <select\n            value={rule.severity}\n            onChange={(event) =>\n              onChange({\n                ...rule,\n                severity: event.target\n                  .value as ComponentAccessibilityRuleDraft['severity'],\n              })\n            }\n            className={fieldClassName}\n          >\n            <option value=\"info\">{labels.severities.info}</option>\n            <option value=\"warning\">{labels.severities.warning}</option>\n            <option value=\"critical\">{labels.severities.critical}</option>\n          </select>\n        </label>""",
              """        <div className=\"grid min-w-0 gap-1.5\">\n          <label\n            htmlFor={`accessibility-severity-${rule.key}`}\n            className=\"text-content-secondary text-xs font-semibold\"\n          >\n            {labels.accessibility.severity}\n          </label>\n          <Select<ComponentAccessibilityRuleDraft['severity']>\n            id={`accessibility-severity-${rule.key}`}\n            value={rule.severity}\n            options={[\n              { value: 'info', label: labels.severities.info },\n              { value: 'warning', label: labels.severities.warning },\n              { value: 'critical', label: labels.severities.critical },\n            ]}\n            onValueChange={(severity) => onChange({ ...rule, severity })}\n            placeholder={labels.accessibility.severity}\n            size=\"sm\"\n          />\n        </div>""",
          )
          replace(
              editor,
              """        <label className=\"grid min-w-0 gap-1.5\">\n          <span className=\"text-content-secondary text-xs font-semibold\">\n            {labels.visualTokens.tokenType}\n          </span>\n          <select\n            value={binding.tokenType}\n            onChange={(event) =>\n              onChange({\n                ...binding,\n                tokenType: event.target\n                  .value as ComponentTokenBindingDraft['tokenType'],\n              })\n            }\n            className={fieldClassName}\n          >\n            <option value=\"color\">color</option>\n            <option value=\"spacing\">spacing</option>\n            <option value=\"radius\">radius</option>\n            <option value=\"typography\">typography</option>\n            <option value=\"motion\">motion</option>\n          </select>\n        </label>""",
              """        <div className=\"grid min-w-0 gap-1.5\">\n          <label\n            htmlFor={`token-binding-type-${binding.draftId}`}\n            className=\"text-content-secondary text-xs font-semibold\"\n          >\n            {labels.visualTokens.tokenType}\n          </label>\n          <Select<ComponentTokenBindingDraft['tokenType']>\n            id={`token-binding-type-${binding.draftId}`}\n            value={binding.tokenType}\n            options={[\n              { value: 'color', label: labels.visualTokens.tokenTypes.color },\n              { value: 'spacing', label: labels.visualTokens.tokenTypes.spacing },\n              { value: 'radius', label: labels.visualTokens.tokenTypes.radius },\n              {\n                value: 'typography',\n                label: labels.visualTokens.tokenTypes.typography,\n              },\n              { value: 'motion', label: labels.visualTokens.tokenTypes.motion },\n            ]}\n            onValueChange={(tokenType) =>\n              onChange({ ...binding, tokenType, tokenPath: '' })\n            }\n            placeholder={labels.visualTokens.tokenType}\n            size=\"sm\"\n          />\n        </div>""",
          )
          replace(
              editor,
              """        <label className=\"grid min-w-0 gap-1.5\">\n          <span className=\"text-content-secondary text-xs font-semibold\">\n            {labels.visualTokens.tokenPath}\n          </span>\n          <select\n            value={binding.tokenPath}\n            onChange={(event) =>\n              onChange({ ...binding, tokenPath: event.target.value })\n            }\n            className={`${fieldClassName} font-mono`}\n          >\n            <option value=\"\">{labels.visualTokens.selectToken}</option>\n            {!hasCurrentTokenPath && binding.tokenPath ? (\n              <option value={binding.tokenPath}>{binding.tokenPath}</option>\n            ) : null}\n            {tokenOptionsForType.map((tokenOption) => (\n              <option key={tokenOption.path} value={tokenOption.path}>\n                {tokenOption.label}\n              </option>\n            ))}\n          </select>\n        </label>""",
              """        <div className=\"grid min-w-0 gap-1.5\">\n          <label\n            htmlFor={`token-binding-path-${binding.draftId}`}\n            className=\"text-content-secondary text-xs font-semibold\"\n          >\n            {labels.visualTokens.tokenPath}\n          </label>\n          <Select\n            id={`token-binding-path-${binding.draftId}`}\n            value={binding.tokenPath}\n            options={[\n              ...(!hasCurrentTokenPath && binding.tokenPath\n                ? [{ value: binding.tokenPath, label: binding.tokenPath }]\n                : []),\n              ...tokenOptionsForType.map((tokenOption) => ({\n                value: tokenOption.path,\n                label: tokenOption.label,\n              })),\n            ]}\n            onValueChange={(tokenPath) => onChange({ ...binding, tokenPath })}\n            placeholder={labels.visualTokens.selectToken}\n            size=\"sm\"\n            textMode=\"technical\"\n          />\n        </div>""",
          )
          replace(
              editor,
              """      <input\n        value={value}\n        onChange={(event) => onChange(event.target.value)}\n        className={`${fieldClassName} ${mono ? 'font-mono' : ''}`}\n      />""",
              """      <Input\n        value={value}\n        onChange={(event) => onChange(event.target.value)}\n        size=\"sm\"\n        textMode={mono ? 'technical' : 'default'}\n      />""",
          )
          replace(
              editor,
              """      <textarea\n        value={value}\n        rows={rows}\n        onChange={(event) => onChange(event.target.value)}\n        className={`${fieldClassName} resize-y py-2 leading-5`}\n      />""",
              """      <Textarea\n        value={value}\n        rows={rows}\n        onChange={(event) => onChange(event.target.value)}\n        size=\"sm\"\n        className=\"leading-5\"\n      />""",
          )
          replace(
              editor,
              """\nconst fieldClassName =\n  'border-border-subtle bg-surface-primary focus:border-action-primary min-h-9 w-full min-w-0 rounded-md border px-3 text-[0.8125rem] outline-none transition';\n""",
              "\n",
          )

          details = 'src/features/components/ComponentDetailsPanel.tsx'
          replace(
              details,
              """      selectToken: t('editor.visualTokens.selectToken'),\n    },""",
              """      selectToken: t('editor.visualTokens.selectToken'),\n      tokenTypes: {\n        color: t('editor.visualTokens.tokenTypes.color'),\n        spacing: t('editor.visualTokens.tokenTypes.spacing'),\n        radius: t('editor.visualTokens.tokenTypes.radius'),\n        typography: t('editor.visualTokens.tokenTypes.typography'),\n        motion: t('editor.visualTokens.tokenTypes.motion'),\n      },\n    },""",
          )

          messages = 'src/messages/component-guidelines.ts'
          replace(
              messages,
              """        visualTokens: {\n          description:\n            'Map design system tokens to the supported preview roles: background, foreground, border, radius, padding, paddingX, paddingY, duration or motion.',\n        },""",
              """        visualTokens: {\n          description:\n            'Map design system tokens to the supported preview roles: background, foreground, border, radius, padding, paddingX, paddingY, duration or motion.',\n          tokenTypes: {\n            color: 'Color',\n            spacing: 'Spacing',\n            radius: 'Radius',\n            typography: 'Typography',\n            motion: 'Motion',\n          },\n        },""",
          )
          replace(
              messages,
              """        visualTokens: {\n          description:\n            'Associez les tokens du design system aux rôles de preview pris en charge : background, foreground, border, radius, padding, paddingX, paddingY, duration ou motion.',\n        },""",
              """        visualTokens: {\n          description:\n            'Associez les tokens du design system aux rôles de preview pris en charge : background, foreground, border, radius, padding, paddingX, paddingY, duration ou motion.',\n          tokenTypes: {\n            color: 'Couleur',\n            spacing: 'Espacement',\n            radius: 'Rayon',\n            typography: 'Typographie',\n            motion: 'Mouvement',\n          },\n        },""",
          )
          PY
          npm run format

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ds-170-07): migrate remaining component editor controls"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
