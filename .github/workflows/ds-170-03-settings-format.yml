name: DS-170-03 Settings Finalize

on:
  push:
    branches:
      - feature/ds-170-03-settings-redesign

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update settings translations
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const translations = {
            en: {
              accountDescription:
                'Your personal identity for the authenticated workspace.',
              accountTitle: 'Profile',
              preferencesDescription:
                'Choose the language and appearance used by VulcanForgeUI.',
              preferencesTitle: 'Preferences',
            },
            fr: {
              accountDescription:
                'Votre identité personnelle pour l’espace de travail authentifié.',
              accountTitle: 'Profil',
              preferencesDescription:
                'Choisissez la langue et l’apparence utilisées par VulcanForgeUI.',
              preferencesTitle: 'Préférences',
            },
          };

          for (const [locale, values] of Object.entries(translations)) {
            const path = `src/messages/${locale}.json`;
            const messages = JSON.parse(fs.readFileSync(path, 'utf8'));

            messages.SettingsPage.account.title = values.accountTitle;
            messages.SettingsPage.account.description =
              values.accountDescription;
            messages.SettingsPage.preferences = {
              description: values.preferencesDescription,
              title: values.preferencesTitle,
            };

            fs.writeFileSync(path, `${JSON.stringify(messages, null, 2)}\n`);
          }
          NODE

      - name: Format settings sources
        run: >-
          npx prettier
          src/app/[locale]/app/settings/page.tsx
          src/app/[locale]/app/settings/loading.tsx
          src/features/settings/SettingsForm.tsx
          src/features/settings/SettingsForm.test.tsx
          src/messages/en.json
          src/messages/fr.json
          --write

      - name: Commit finalized sources
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/[locale]/app/settings/page.tsx \
            src/app/[locale]/app/settings/loading.tsx \
            src/features/settings/SettingsForm.tsx \
            src/features/settings/SettingsForm.test.tsx \
            src/messages/en.json \
            src/messages/fr.json
          git commit -m "style(settings): finalize redesigned settings page"
          git push
