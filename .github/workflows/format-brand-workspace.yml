name: Format Brand workspace

on:
  push:
    branches:
      - feature/ds-170-05-brand-profile

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format workspace files
        run: npm run format

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-brand-workspace
          path: |
            src/features/brand/BrandProfileEditor.tsx
            src/app/[locale]/app/projects/[projectSlug]/brand/loading.tsx
            src/messages/brand-profile-messages.ts
            docs/product/ds-170-05-brand-profile-audit.md
          if-no-files-found: error
          retention-days: 1
