name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Format DS-170-07E sources
        run: npm run format

      - name: Upload formatted DS-170-07E sources
        uses: actions/upload-artifact@v4
        with:
          name: ds-170-07e-formatted
          path: |
            docs/product/ds-170-07e-component-preview-role-bindings.md
            src/features/components/ComponentContractEditor.test.tsx
            src/features/components/ComponentContractEditorSections.tsx
            src/features/components/ComponentDetailsPanel.tsx
            src/features/components/ComponentPreviewRoleField.tsx

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run UI audit
        run: npm run audit:ui

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
