name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved QA corrections
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/ds-170-07-visual-debt-audit' }}
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              content = file.read_text()
              if old in content:
                  file.write_text(content.replace(old, new, count))

          Path('src/features/settings/ThemePreferenceInitScript.tsx').write_text("""import { themePreferenceStorageKey } from './theme-preference.client';

export function ThemePreferenceInitScript() {
  const script = `
(function () {
  try {
    var storageKey = ${JSON.stringify(themePreferenceStorageKey)};
    var storedPreference = window.localStorage.getItem(storageKey);
    var themePreference =
      storedPreference === 'dark' ||
      storedPreference === 'light' ||
      storedPreference === 'system'
        ? storedPreference
        : 'system';

    var resolvedTheme =
      themePreference === 'system'
        ? window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        : themePreference;

    var root = document.documentElement;

    root.classList.toggle('dark', resolvedTheme === 'dark');
    root.dataset.themePreference = themePreference;
    root.dataset.theme = resolvedTheme;
    root.style.colorScheme = resolvedTheme;
  } catch {
  }
})();
`;

  return (
    <script
      id="theme-preference-init"
      dangerouslySetInnerHTML={{ __html: script }}
    />
  );
}
""")

