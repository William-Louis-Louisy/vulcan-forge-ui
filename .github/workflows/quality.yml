name: Quality

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich-tester-guide:
    name: Enrich tester guide
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v6
        with:
          ref: docs/tester-user-guide

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract and run field guidance migration
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/enrich-tester-guide-fields.yml \
            | sed '1d;$d;s/^          //' \
            > /tmp/enrich-tester-guide-fields.py
          python /tmp/enrich-tester-guide-fields.py

      - name: Format tester guide
        run: npx prettier docs/testing/vulcanforge-ui-guide-testeurs.fr.md --write

      - name: Restore standard workflow and remove temporary migration
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality.yml
          rm .github/workflows/enrich-tester-guide-fields.yml

      - name: Commit enriched guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(testing): explain the purpose of editable fields"
          git push origin HEAD:docs/tester-user-guide
