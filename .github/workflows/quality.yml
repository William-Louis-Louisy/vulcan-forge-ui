name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply visual QA refinements
        run: node scripts/apply-exports-visual-qa-refinements.mjs

      - name: Format refined files
        run: |
          npx prettier \
            src/features/exports/ExportCenterClient.tsx \
            src/features/exports/ExportCodePreview.tsx \
            src/features/exports/ExportCodePreview.test.tsx \
            src/features/documentation/DocumentationGeneratorClient.tsx \
            --write

      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/exports/ExportCenterClient.tsx \
            src/features/exports/ExportCodePreview.tsx \
            src/features/exports/ExportCodePreview.test.tsx \
            src/features/documentation/DocumentationGeneratorClient.tsx \
            scripts/apply-exports-visual-qa-refinements.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "fix(exports): refine visual hierarchy after QA"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
