name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test SegmentedControl
        if: always()
        run: npx vitest run src/components/ui/SegmentedControl.test.tsx

      - name: Test Select
        if: always()
        run: npx vitest run src/components/ui/Select.test.tsx

      - name: Test theme mapping
        if: always()
        run: npx vitest run src/features/themes/ThemeTokenReferenceEditor.test.tsx

      - name: Test theme preview
        if: always()
        run: npx vitest run src/features/themes/PreviewPanel.test.tsx

      - name: Run tests
        if: always()
        run: npm run test

      - name: Build application
        if: always()
        run: npm run build
