name: DS-170-07 QA corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

jobs:
  correct:
    name: Apply and validate QA corrections
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-07-visual-debt-audit
          fetch-depth: 0

      - name: Apply focused corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding='utf-8')
              occurrences = content.count(old)
              if occurrences != 1:
                  raise RuntimeError(
                      f'Expected exactly one source fragment in {path}, found {occurrences}: {old!r}'
                  )
              file_path.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/components/ui/Button.tsx',
              "sm: 'rounded-md px-3 py-2 text-xs',",
              "sm: 'min-h-9 rounded-md px-3 py-1.5 text-xs',",
          )
          replace_once(
              'src/components/ui/Button.tsx',
              "md: 'rounded-md px-4 py-2 text-sm',",
              "md: 'min-h-10 rounded-md px-4 py-2 text-sm',",
          )
          replace_once(
              'src/components/ui/Button.tsx',
              "lg: 'rounded-md px-5 py-2 text-sm',",
              "lg: 'min-h-11 rounded-md px-5 py-2.5 text-sm',",
          )

          Path('src/features/tokens/editor/TokenEditorToolbar.tsx').write_text(
              """import { Button, Input } from '@/components/ui';

          type TokenEditorToolbarProps = {
            searchLabel: string;
            searchPlaceholder: string;
            newTokenLabel: string;
            tokenSearchQuery: string;
            onSearchChange: (query: string) => void;
            isNewTokenDisabled: boolean;
            onNewTokenClick: () => void;
          };

          export function TokenEditorToolbar({
            searchLabel,
            searchPlaceholder,
            newTokenLabel,
            tokenSearchQuery,
            onSearchChange,
            isNewTokenDisabled,
            onNewTokenClick,
          }: TokenEditorToolbarProps) {
            return (
              <div className=\"mt-8 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between\">
                <label className=\"sr-only\" htmlFor=\"token-search\">
                  {searchLabel}
                </label>

                <Input
                  id=\"token-search\"
                  type=\"search\"
                  value={tokenSearchQuery}
                  onChange={(event) => onSearchChange(event.target.value)}
                  placeholder={searchPlaceholder}
                  size=\"sm\"
                  className=\"sm:w-64\"
                />

                <Button
                  disabled={isNewTokenDisabled}
                  onClick={onNewTokenClick}
                  size=\"sm\"
                  className=\"shrink-0\"
                >
                  + {newTokenLabel}
                </Button>
              </div>
            );
          }
          """,
              encoding='utf-8',
          )

          replace_once(
              'src/features/components/ComponentContractEditorSections.tsx',
              'className="border-border-subtle min-w-0 overflow-hidden rounded-md border"',
              'className="border-border-subtle min-w-0 rounded-md border"',
          )

          replace_once(
              'src/domain/ai-instructions/ai-instructions.ts',
              """import type {
            BrandProfile,
            ComponentContract,
            DesignToken,
          } from '@/domain/design-system';""",
              """import {
            getComponentAnatomyPartKey,
            type BrandProfile,
            type ComponentContract,
            type DesignToken,
          } from '@/domain/design-system';""",
          )
          replace_once(
              'src/domain/ai-instructions/ai-instructions.ts',
              "    const anatomy = component.anatomy.join(', ') || t.none;",
              """    const anatomy =
                component.anatomy.map(getComponentAnatomyPartKey).join(', ') || t.none;""",
          )

          replace_once(
              'src/domain/ai-instructions/ai-instructions.test.ts',
              "    anatomy: ['root', 'label', 'icon'],",
              """    anatomy: [
              {
                key: 'root',
                label: { en: 'Root', fr: 'Racine' },
                requirement: 'required',
              },
              {
                key: 'label',
                label: { en: 'Label', fr: 'Libellé' },
                requirement: 'required',
              },
              {
                key: 'icon',
                label: { en: 'Icon', fr: 'Icône' },
                requirement: 'optional',
              },
            ],""",
          )
          replace_once(
              'src/domain/ai-instructions/ai-instructions.test.ts',
              "    expect(result.content).toContain('## Component rules');",
              """    expect(result.content).toContain('## Component rules');
              expect(result.content).toContain('- **Anatomy:** root, label, icon');
              expect(result.content).not.toContain('[object Object]');""",
          )

          Path('src/components/ui/ControlDensity.test.tsx').write_text(
              """import { render, screen } from '@testing-library/react';
          import { describe, expect, it } from 'vitest';

          import { Button } from './Button';
          import { Input } from './Input';
          import { Select } from './Select';

          const options = [{ value: 'ready', label: 'Ready' }] as const;

          describe('shared control density', () => {
            it('aligns small inputs, selects and buttons to the compact editor density', () => {
              render(
                <>
                  <label htmlFor=\"compact-input\">Compact input</label>
                  <Input id=\"compact-input\" size=\"sm\" />
                  <label htmlFor=\"compact-select\">Compact select</label>
                  <Select
                    id=\"compact-select\"
                    value=\"ready\"
                    options={options}
                    onValueChange={() => undefined}
                    placeholder=\"Choose\"
                    size=\"sm\"
                  />
                  <Button size=\"sm\">Compact action</Button>
                </>,
              );

              expect(
                screen.getByRole('textbox', { name: 'Compact input' }),
              ).toHaveClass('min-h-9');
              expect(
                screen.getByRole('combobox', { name: 'Compact select' }),
              ).toHaveClass('min-h-9');
              expect(
                screen.getByRole('button', { name: 'Compact action' }),
              ).toHaveClass('min-h-9');
            });

            it('aligns standard inputs, selects and buttons to the default editor density', () => {
              render(
                <>
                  <label htmlFor=\"standard-input\">Standard input</label>
                  <Input id=\"standard-input\" size=\"md\" />
                  <label htmlFor=\"standard-select\">Standard select</label>
                  <Select
                    id=\"standard-select\"
                    value=\"ready\"
                    options={options}
                    onValueChange={() => undefined}
                    placeholder=\"Choose\"
                    size=\"md\"
                  />
                  <Button size=\"md\">Standard action</Button>
                </>,
              );

              expect(
                screen.getByRole('textbox', { name: 'Standard input' }),
              ).toHaveClass('min-h-10');
              expect(
                screen.getByRole('combobox', { name: 'Standard select' }),
              ).toHaveClass('min-h-10');
              expect(
                screen.getByRole('button', { name: 'Standard action' }),
              ).toHaveClass('min-h-10');
            });
          });
          """,
              encoding='utf-8',
          )

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format corrected files
        run: >-
          npx prettier --write
          src/components/ui/Button.tsx
          src/components/ui/ControlDensity.test.tsx
          src/features/tokens/editor/TokenEditorToolbar.tsx
          src/features/components/ComponentContractEditorSections.tsx
          src/domain/ai-instructions/ai-instructions.ts
          src/domain/ai-instructions/ai-instructions.test.ts

      - name: Run complete quality gate
        run: npm run quality

      - name: Restore standard workflow and remove temporary artifacts
        run: |
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm .github/workflows/ds-170-07-qa-corrections.yml

      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ds-170-07): apply product-owner QA corrections"
          git push origin HEAD:feature/ds-170-07-visual-debt-audit
