name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit "$status"

      - name: Upload typecheck diagnostics
        if: always() && hashFiles('typecheck.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        shell: bash
        run: |
          set +e
          npm run format:check > format-check.log 2>&1
          status=$?
          cat format-check.log
          exit "$status"

      - name: Generate formatting patch
        if: failure()
        run: |
          npm run format
          git diff -- .github/workflows/quality.yml src/domain/i18n/localized-content.ts > formatting.patch

      - name: Upload formatting diagnostics
        if: always() && hashFiles('formatting.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: formatting-diagnostics
          path: |
            format-check.log
            formatting.patch
          if-no-files-found: error
          retention-days: 1

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
