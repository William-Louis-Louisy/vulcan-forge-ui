name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-auth-core:
    name: Declare Auth.js core dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-01-foundations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Declare reviewed Auth.js core version
        run: npm install @auth/core@0.41.3 --save-exact

      - name: Format package metadata
        run: npx prettier package.json package-lock.json --write

      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(auth): declare Auth.js core dependency"
          git push origin HEAD:feature/ds-170-auth-01-foundations
