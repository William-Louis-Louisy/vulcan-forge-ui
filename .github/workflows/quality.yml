name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://vulcan:vulcan_dev_password@localhost:5432/vulcan_forge_ui?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Format overview page for diagnostics
        shell: bash
        run: |
          npx prettier --write 'src/app/[locale]/app/projects/[projectSlug]/page.tsx'
          mkdir -p formatted-sources
          cp 'src/app/[locale]/app/projects/[projectSlug]/page.tsx' formatted-sources/project-overview-page.tsx

      - name: Upload formatted overview page
        uses: actions/upload-artifact@v4
        with:
          name: formatted-overview-page
          path: formatted-sources/project-overview-page.tsx
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
