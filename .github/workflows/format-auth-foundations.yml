name: Format authentication foundations

on:
  push:
    branches:
      - feature/ds-170-auth-01-foundations
    paths:
      - .github/workflows/format-auth-foundations.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/ds-170-auth-01-foundations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format authentication files
        run: |
          npx prettier \
            .env.example \
            .gitignore \
            README.md \
            docs/product/ds-170-auth-01-foundations.md \
            package.json \
            package-lock.json \
            prisma/migrations/20260803143000_add_auth_rate_limit_buckets/migration.sql \
            prisma/schema.prisma \
            src/auth.ts \
            src/features/auth/login/login.action.ts \
            src/features/auth/login/login.errors.test.ts \
            src/features/auth/login/login.errors.ts \
            src/features/auth/login/login.state.ts \
            src/features/auth/signup/signup.action.test.ts \
            src/features/auth/signup/signup.action.ts \
            src/features/auth/signup/signup.errors.test.ts \
            src/features/auth/signup/signup.errors.ts \
            src/features/auth/signup/signup.state.ts \
            src/messages/en.json \
            src/messages/fr.json \
            src/server/auth/auth-errors.ts \
            src/server/auth/auth-rate-limit.test.ts \
            src/server/auth/auth-rate-limit.ts \
            src/server/auth/auth-request-context.test.ts \
            src/server/auth/auth-request-context.ts \
            src/server/auth/auth-security-events.ts \
            src/server/auth/credentials-authorizer.test.ts \
            src/server/auth/credentials-authorizer.ts \
            --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            .gitignore \
            README.md \
            docs/product/ds-170-auth-01-foundations.md \
            package.json \
            package-lock.json \
            prisma/migrations/20260803143000_add_auth_rate_limit_buckets/migration.sql \
            prisma/schema.prisma \
            src/auth.ts \
            src/features/auth/login/login.action.ts \
            src/features/auth/login/login.errors.test.ts \
            src/features/auth/login/login.errors.ts \
            src/features/auth/login/login.state.ts \
            src/features/auth/signup/signup.action.test.ts \
            src/features/auth/signup/signup.action.ts \
            src/features/auth/signup/signup.errors.test.ts \
            src/features/auth/signup/signup.errors.ts \
            src/features/auth/signup/signup.state.ts \
            src/messages/en.json \
            src/messages/fr.json \
            src/server/auth/auth-errors.ts \
            src/server/auth/auth-rate-limit.test.ts \
            src/server/auth/auth-rate-limit.ts \
            src/server/auth/auth-request-context.test.ts \
            src/server/auth/auth-request-context.ts \
            src/server/auth/auth-security-events.ts \
            src/server/auth/credentials-authorizer.test.ts \
            src/server/auth/credentials-authorizer.ts
          git commit -m "chore(auth): format authentication foundations"
          git push origin HEAD:feature/ds-170-auth-01-foundations

# Triggered after all scoped implementation files were added.
