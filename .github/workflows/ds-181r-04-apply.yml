name: DS-181R-04 apply

on:
  push:
    branches:
      - agent/ds-181r-04-textfield-customization
    paths:
      - .github/workflows/ds-181r-04-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-04-textfield-customization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply R04 implementation
        run: python scripts/ds-181r-04-apply.py
      - name: Format touched files
        run: npx prettier --write src/features/components/update-button-visual-customization.action.ts src/features/components/ComponentContractEditor.tsx src/features/components/ComponentContractEditorSections.tsx src/features/components/ComponentFoundationsPreviewClient.tsx src/features/components/ButtonVisualPreviewMatrix.tsx src/messages/component-v2-customization-messages.ts docs/product/ds-181r-04-textfield-customization.md
      - name: Focused tests
        run: npx vitest run src/features/components/ButtonVisualCustomizationEditor.test.tsx src/features/components/ComponentContractEditor.test.tsx src/features/components/ComponentFoundationsPreviewClient.test.tsx src/messages/component-v2-customization-messages.test.ts
      - name: Typecheck
        run: |
          npm run db:generate
          npm run typecheck
      - name: Remove temporary assets
        run: git rm .github/workflows/ds-181r-04-apply.yml scripts/ds-181r-04-apply.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "feat: generalize V2 visual inspector to TextField"
          git push origin HEAD:agent/ds-181r-04-textfield-customization
