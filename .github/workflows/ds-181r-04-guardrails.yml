name: DS-181R-04 guardrails

on:
  push:
    branches:
      - agent/ds-181r-04-textfield-customization
    paths:
      - .github/workflows/ds-181r-04-guardrails.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ds-181r-04-textfield-customization
          fetch-depth: 0
      - name: Apply R04 guardrails
        run: python scripts/ds-181r-04-guardrails.py
      - name: Remove temporary assets
        run: git rm .github/workflows/ds-181r-04-guardrails.yml scripts/ds-181r-04-guardrails.py
      - name: Commit guardrails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "test: lock TextField V2 inspector and preview path"
          git push origin HEAD:agent/ds-181r-04-textfield-customization
