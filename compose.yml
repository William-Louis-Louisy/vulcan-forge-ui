services:
  postgres:
    image: postgres:16-alpine
    container_name: vulcan-forge-ui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulcan
      POSTGRES_PASSWORD: vulcan_dev_password
      POSTGRES_DB: vulcan_forge_ui
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vulcan -d vulcan_forge_ui']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
